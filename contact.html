
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — J.P. Creative Hub</title>
  <meta name="description" content="Contact J.P. Creative Hub: (916) 318-5507, info@jpcreatives.cc." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Outfit:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f7f6f3;
      --ink: #3E5734;
      --line: #d5ddd0;
      --serif: "Cormorant Garamond", Georgia, serif;
      --sans: "Outfit", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-weight: 300;
      letter-spacing: 0.01em;
      line-height: 1.6;
    }
    a { color: inherit; text-decoration: none; }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 28px 7vw;
      position: sticky;
      top: 0;
      background: rgba(247, 246, 243, 0.9);
      backdrop-filter: blur(10px);
      z-index: 2;
    }
    .mark {
      font-family: var(--serif);
      font-size: 1.35rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
    nav { display: flex; gap: 28px; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; }
    nav a { color: var(--ink); }
    .hero { padding: 12vh 7vw 10vh; }
    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      margin-bottom: 22px;
    }
    h1 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(3.2rem, 7vw, 6.4rem);
      line-height: 0.92;
      margin: 0 0 28px;
      letter-spacing: -0.02em;
      color: var(--ink);
    }
    h1 em { font-style: italic; font-weight: 400; }
    .lede { max-width: 520px; font-size: 1.08rem; color: var(--ink); }
    .cta {
      display: inline-block;
      margin-top: 36px;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 4px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.75rem;
      color: var(--ink);
    }
    section { padding: 8vh 7vw; border-top: 1px solid var(--line); }
    h2 {
      font-family: var(--serif);
      font-weight: 400;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      margin: 10px 0 48px;
      color: var(--ink);
    }
    .service {
      display: grid;
      grid-template-columns: 72px 220px 1fr;
      gap: 24px;
      padding: 28px 0;
      border-top: 1px solid var(--line);
      align-items: baseline;
    }
    .service:last-of-type { border-bottom: 1px solid var(--line); }
    .num { color: var(--ink); font-size: 0.78rem; letter-spacing: 0.12em; }
    .service h3 { margin: 0; font-weight: 400; font-size: 1rem; color: var(--ink); }
    .service p { margin: 0; color: var(--ink); max-width: 560px; }
    .also {
      max-width: 640px;
      margin: 56px 0 0;
      color: var(--ink);
      font-family: var(--serif);
      font-size: 1.55rem;
      line-height: 1.35;
    }
    .contact { display: grid; grid-template-columns: 1fr 1fr; gap: 40px; align-items: end; }
    .phone, .mail {
      display: block;
      font-family: var(--sans);
      font-weight: 300;
      font-size: 1.1rem;
      letter-spacing: 0.02em;
      border-bottom: 1px solid var(--line);
      width: fit-content;
      padding: 6px 0 4px;
      margin-bottom: 14px;
      color: var(--ink);
    }
    .phone:hover, .mail:hover, .phone:focus-visible, .mail:focus-visible { border-color: var(--ink); }
    form { display: grid; gap: 14px; }
    input, textarea {
      width: 100%;
      background: transparent;
      border: 0;
      border-bottom: 1px solid var(--line);
      padding: 12px 0;
      font: inherit;
      color: var(--ink);
      outline: none;
    }
    input::placeholder, textarea::placeholder { color: var(--ink); opacity: 0.55; }
    input:focus, textarea:focus { border-color: var(--ink); }
    button {
      justify-self: start;
      margin-top: 8px;
      background: var(--ink);
      color: var(--bg);
      border: 0;
      padding: 14px 28px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      font-size: 0.72rem;
      cursor: pointer;
    }
    footer {
      padding: 28px 7vw 40px;
      display: flex;
      justify-content: space-between;
      color: var(--ink);
      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }
    @media (max-width: 800px) {
      .service, .contact { grid-template-columns: 1fr; }
    }
    .foot-mark{display:inline-flex;align-items:center;gap:10px}
    .foot-mark img{height:18px;width:auto;opacity:.75}
    nav a[aria-current="page"] { border-bottom: 1px solid var(--ink); padding-bottom: 3px; }
    .menu { display: none; position: relative; font-size: 0.78rem; letter-spacing: 0.14em; text-transform: uppercase; }
    .menu summary { list-style: none; cursor: pointer; padding: 6px 0; border-bottom: 1px solid var(--ink); }
    .menu summary::-webkit-details-marker { display: none; }
    .menu[open] summary { border-color: transparent; }
    .menu nav { display: flex; flex-direction: column; gap: 16px; position: absolute; right: 0; top: 40px; background: var(--bg); border: 1px solid var(--line); padding: 20px 24px; min-width: 160px; }
    .more { display: inline-block; margin-top: 40px; border-bottom: 1px solid var(--ink); padding-bottom: 4px; letter-spacing: 0.16em; text-transform: uppercase; font-size: 0.75rem; }
    @media (max-width: 800px) { header > nav { display: none; } .menu { display: block; } }
  </style>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
</head>
<body>
  <header>
    <a class="mark" href="index.html">J.P. Creative Hub</a>
    <nav aria-label="Main">
      <a href="about.html">About</a>
      <a href="services.html">Services</a>
      <a href="contact.html" aria-current="page">Contact</a>
    </nav>
    <details class="menu">
      <summary>Menu</summary>
      <nav aria-label="Main">
        <a href="about.html">About</a>
        <a href="services.html">Services</a>
        <a href="contact.html" aria-current="page">Contact</a>
      </nav>
    </details>
  </header>

  <main>
    <section id="contact" class="contact-page">
      <div class="contact">
        <div>
          <p class="eyebrow">Contact</p>
          <h2>Tell us what you need.</h2>
          <a class="phone" href="tel:9163185507">(916) 318-5507</a>
          <a class="mail" href="mailto:info@jpcreatives.cc">info@jpcreatives.cc</a>
        </div>
        <form action="mailto:info@jpcreatives.cc" method="post" enctype="text/plain">
          <input name="name" placeholder="Name" required />
          <input name="email" type="email" placeholder="Email" required />
          <textarea name="message" rows="4" placeholder="Project" required></textarea>
          <button type="submit">Send</button>
        </form>
      </div>
    </section>
  </main>

  <footer>
    <span class="foot-mark"><img src="assets/jpch-mark.svg" alt="" aria-hidden="true">J.P. Creative Hub LLC</span>
    <span>Juan Carlos · Pang</span>
  </footer>
</body>
</html>
