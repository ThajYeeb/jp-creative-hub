<title>📅 Daily Review (Sandbox)</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --accent: #1F4E79; --accent2: #2E75B6;
    --text: #1e293b; --muted: #64748b; --border: #cbd5e1;
    --ok-bg: #ecfdf5; --ok-border: #10b981; --warn-bg: #fffbeb; --warn-border: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 18px 14px 48px; line-height: 1.5; max-width: 960px; margin-left: auto; margin-right: auto; }
  .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .nav-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .nav-links a { text-decoration: none; color: var(--accent); font-weight: 600; font-size: 0.9rem; background: #e2e8f0; padding: 6px 12px; border-radius: 8px; }
  .nav-links a.active { background: var(--accent); color: #fff; }
  .lang-switch { display: inline-flex; flex-wrap: wrap; background: #e2e8f0; border-radius: 999px; padding: 3px; gap: 2px; }
  .lang-btn { background: transparent; color: #334155; border: none; padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .panel { background: var(--card); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid #e2e8f0; }
  h1 { color: var(--accent); font-size: 1.45rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.92rem; margin: 0; }
  .sync-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  input[type="text"], select { padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.92rem; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .btn:hover { background: var(--accent2); }
  .btn-outline { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
  .btn-outline.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-ok { background: #059669; color: #fff; }
  .btn-warn { background: #d97706; color: #fff; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .pill { background: #f1f5f9; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 0.84rem; font-weight: 600; cursor: pointer; color: #334155; }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stage-wrap { perspective: 1100px; max-width: 560px; margin: 14px auto; }
  .flashcard { width: 100%; min-height: 350px; background: #fff; border-radius: 16px; border: 2px solid var(--accent2); box-shadow: 0 8px 24px rgba(31,78,121,0.12); padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease; position: relative; }
  .flashcard:hover { box-shadow: 0 12px 28px rgba(31,78,121,0.18); }
  .card-badges { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .badge { background: #e0f2fe; color: #0369a1; padding: 3px 9px; border-radius: 999px; }
  .visual-box { width: 220px; height: 155px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 10px 0; position: relative; }
  .visual-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .visual-emoji { font-size: 4rem; line-height: 1; }
  .hmong-word { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin: 4px 0; letter-spacing: 0.3px; }
  .meaning-main { font-size: 1.45rem; font-weight: 700; color: #0f172a; margin: 4px 0; }
  .gloss-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 100%; margin-top: 8px; text-align: left; font-size: 0.84rem; background: #f8fafc; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
  .controls-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
  .add-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
  .preview-strip { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px; background: #f8fafc; border-radius: 10px; border: 1px dashed var(--border); }
  .preview-thumb { width: 72px; height: 72px; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 2.2rem; flex-shrink: 0; }
  .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .quiz-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; margin-top: 12px; }
  .quiz-btn { padding: 12px; border-radius: 10px; border: 2px solid var(--border); background: #fff; font-weight: 600; font-size: 0.96rem; cursor: pointer; text-align: left; }
  .quiz-btn.correct { border-color: #10b981; background: #ecfdf5; color: #065f46; }
  .quiz-btn.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .hidden { display: none !important; }

<script>
(function(){
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('themeToggleBtn');
    if (btn) {
      btn.innerHTML = t === 'dark' ? '☀️ Light' : '🌙 Dark';
      btn.title = t === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    }
  }
  window.toggleHmongTheme = function() {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('hmong_theme', next); } catch(e) {}
    applyTheme(next);
  };
  var saved = 'light';
  try {
    saved = localStorage.getItem('hmong_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch(e) {}
  applyTheme(saved);
  document.addEventListener('DOMContentLoaded', function() { applyTheme(saved); });
})();
</script>

let uiLang=(function(){const q=new URLSearchParams(location.search).get('lang');if(LANGS.includes(q)){try{localStorage.setItem('hmong_ui_lang',q)}catch(e){}return q;}let s='en';try{s=localStorage.getItem('hmong_ui_lang')||'en'}catch(e){}return LANGS.includes(s)?s:'en';})();
function t(k){return (STR[uiLang]&&STR[uiLang][k]!=null)?STR[uiLang][k]:(STR.en[k]!=null?STR.en[k]:k);}

function studentCode(){let c='';const q=new URLSearchParams(location.search).get('code');try{c=(q||localStorage.getItem('hmong_student_code')||'')}catch(e){c=q||''}c=c.trim().toUpperCase().replace(/^HMONG-/,'HMOOB-');return /^HMOOB-\d{2}$/.test(c)?c:'';}

let curAudio=null;
function playUrl(u){try{if(curAudio)curAudio.pause();curAudio=new Audio(u);const p=curAudio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
/* recorder: audio/mp4 first for iPhone */
const REC_TYPES=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
let activeRec=null;
async function startRec(onDone,maxMs){
 if(activeRec){stopRec();return null;}
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 const mt=(window.MediaRecorder&&MediaRecorder.isTypeSupported)?REC_TYPES.find(x=>MediaRecorder.isTypeSupported(x)):null;
 const mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
 const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 mr.onstop=()=>{stream.getTracks().forEach(tr=>tr.stop());const type=mr.mimeType||mt||(chunks[0]&&chunks[0].type)||'audio/mp4';activeRec=null;onDone(new Blob(chunks,{type}));};
 mr.start(250);activeRec={mr,timer:maxMs?setTimeout(stopRec,maxMs):null};return activeRec;}
function stopRec(){if(activeRec){clearTimeout(activeRec.timer);if(activeRec.mr.state!=='inactive')activeRec.mr.stop();}}
function blobToDataUrl(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
/* instructor clips (shared /api/phonetics-audio store) */
let CLIPS={};const CLIP_CACHE='hmong_sandbox_clips_cache';
try{CLIPS=JSON.parse(localStorage.getItem(CLIP_CACHE)||'{}')||{}}catch(e){CLIPS={}}
const STUDIO=new URLSearchParams(location.search).get('studio')==='1';
async function loadCloudClips(ids){try{const r=await fetch('/api/phonetics-audio',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(d&&d.ok&&d.clips){const keep={};for(const [id,v] of Object.entries(d.clips)){if(!ids||ids.includes(id))keep[id]={male:v.male||'',female:v.female||''};}CLIPS=Object.assign(CLIPS,keep);try{localStorage.setItem(CLIP_CACHE,JSON.stringify(CLIPS))}catch(e){}if(typeof onClips==='function')onClips();}}catch(e){}}
function hasClip(id,v){return !!(CLIPS[id]&&CLIPS[id][v]);}
function playClip(id,v){if(!v){v=hasClip(id,'female')?'female':'male';}if(hasClip(id,v))playUrl(CLIPS[id][v]);}
async function uploadClip(id,voice,label,blob,statusEl){
 const url=await blobToDataUrl(blob);if(url.length>95000){if(statusEl)statusEl.textContent=t('tooBig');return false;}
 if(!CLIPS[id])CLIPS[id]={male:'',female:''};CLIPS[id][voice]=url;try{localStorage.setItem(CLIP_CACHE,JSON.stringify(CLIPS))}catch(e){}
 if(statusEl)statusEl.textContent=t('uploading');
 try{const r=await fetch('/api/phonetics-audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,voice,label,audioDataUrl:url})});const d=await r.json();if(statusEl)statusEl.textContent=(d&&d.ok)?t('uploaded'):t('upFail');}catch(e){if(statusEl)statusEl.textContent=t('upFail');}
 if(typeof onClips==='function')onClips();return true;}
function clipButtons(id,label){
 let h='';['male','female'].forEach(v=>{h+=`<button class="btn btn-outline mini" ${hasClip(id,v)?'':'disabled style="opacity:.45"'} onclick="playClip('${id}','${v}')">▶ ${t(v)}</button>`;});
 if(STUDIO){h+=`<button class="btn btn-warn mini" onclick="studioRec(this,'${id}','male',${esc(JSON.stringify(label||id))})">${t('recMale')}</button><button class="btn btn-warn mini" onclick="studioRec(this,'${id}','female',${esc(JSON.stringify(label||id))})">${t('recFemale')}</button><span class="mini" id="st_${id}"></span>`;}
 return h;}
async function studioRec(btn,id,voice,label){const st=$('st_'+id);if(activeRec){stopRec();return;}
 try{btn.textContent=t('stop');await startRec(async b=>{btn.textContent=t(voice==='male'?'recMale':'recFemale');await uploadClip(id,voice,label,b,st);},4500);}catch(e){btn.textContent=t(voice==='male'?'recMale':'recFemale');if(st)st.textContent=t('micErr');}}
/* student "your turn" recorder (local only) */
const MY={};
async function myTurn(btn,key,playBtnId){if(activeRec){stopRec();return;}
 try{btn.textContent=t('stop');await startRec(b=>{btn.textContent=t('yourTurn');if(MY[key])URL.revokeObjectURL(MY[key]);MY[key]=URL.createObjectURL(b);const p=$(playBtnId);if(p){p.disabled=false;p.style.opacity=1;}},15000);}catch(e){btn.textContent=t('yourTurn');alert(t('micErr'));}}
function playMine(key){if(MY[key])playUrl(MY[key]);}

  "fish": "🐟", "ntses": "🐟", "chicken": "🐓", "qaib": "🐓", "pig": "🐖", "npua": "🐖",
  "cow": "🐄", "nyuj": "🐄", "horse": "🐎", "nees": "🐎", "house": "🏠", "tsev": "🏠",
  "home": "🏠", "book": "📖", "ntawv": "📖", "phau ntawv": "📘", "water": "💧", "dej": "💧",
  "rice": "🍚", "mov": "🍚", "food": "🍲", "zaub": "🥬", "eat": "🍽️", "noj": "🍽️",
  "drink": "🥤", "haus": "🥤", "friend": "🤝", "phooj ywg": "🤝", "love": "❤️", "hlub": "❤️",
  "help": "🤲", "pab": "🤲", "read": "📖", "nyeem": "📖", "speak": "🗣️", "hais": "🗣️",
  "study": "🎓", "kawm": "🎓", "go": "🚶", "mus": "🚶", "see": "👀", "pom": "👀",
  "know": "💡", "paub": "💡", "good": "👍", "zoo": "👍", "bible": "📖", "prayer": "🙏",
  "pray": "🙏", "thov": "🙏", "god": "✨", "jehovah": "🌌", "kingdom": "👑", "peace": "🕊️"
};
function pickEmoji(h,e){h=(h||'').toLowerCase().trim();e=(e||'').toLowerCase().trim();if(EMOJI_MAP[h])return EMOJI_MAP[h];if(EMOJI_MAP[e])return EMOJI_MAP[e];for(const [k,v] of Object.entries(EMOJI_MAP)){if(e.includes(k))return v;}return '🃏';}
const DECK=[];
CORE_LEXICON.forEach(i=>{const k=i.w.toLowerCase();DECK.push({id:'core:'+k,hm:i.w,en:i.en,vi:(VI_LEX[k]||{}).vi||i.en,ko:(KO_LEX[k]||{}).ko||i.en,ja:(JA_LEX[k]||{}).ja||i.en,tone:i.tone||'',emo:pickEmoji(i.w,i.en)});});
THEOCRATIC_TERMS_51.forEach(i=>{const h=String(i.hm||'').trim();if(!h)return;DECK.push({id:'theo:'+h.toLowerCase(),hm:h,en:i.en,vi:i.vi||i.en,ko:i.ko||i.en,ja:i.ja||i.en,tone:'',emo:pickEmoji(h,i.en)});});
const INTERVALS=[0,1,2,4,7,15,30];const NEW_PER_DAY=10;
const dayStr=(d=new Date())=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const addDays=(s,n)=>{const [y,m,d]=s.split('-').map(Number);return dayStr(new Date(y,m-1,d+n));};
let code=studentCode();let S0;
function key(){return 'hmong_daily_review_'+(code||'GUEST');}
function load(){let o={};try{o=JSON.parse(localStorage.getItem(key())||'{}')||{}}catch(e){}S0=Object.assign({cards:{},streak:0,best:0,last:'',day:'',newToday:0,doneToday:0,extra:0,dir:0},o);
 const td=dayStr();if(S0.day!==td){S0.day=td;S0.newToday=0;S0.doneToday=0;S0.extra=0;}if(S0.last&&S0.last<addDays(td,-1))S0.streak=0;}
function save(){try{localStorage.setItem(key(),JSON.stringify(S0))}catch(e){}}
let queue=[],cur=null,shown=false;
function buildQueue(){const td=dayStr();const due=DECK.filter(c=>S0.cards[c.id]&&S0.cards[c.id].due<=td);
 const fresh=DECK.filter(c=>!S0.cards[c.id]).slice(0,Math.max(0,NEW_PER_DAY+S0.extra-S0.newToday));
 queue=due.sort(()=>Math.random()-.5).concat(fresh);next();}
function next(){cur=queue.shift()||null;shown=false;render();}
function grade(ok){const td=dayStr();const c=S0.cards[cur.id];const isNew=!c;let box=c?c.box:0;box=ok?Math.min(box+1,INTERVALS.length-1):0;
 S0.cards[cur.id]={box,due:addDays(td,ok?INTERVALS[box]:0)};if(isNew)S0.newToday++;S0.doneToday++;
 if(S0.last!==td){S0.streak=(S0.last===addDays(td,-1))?S0.streak+1:1;S0.last=td;}S0.best=Math.max(S0.best,S0.streak);
 if(!ok)queue.splice(Math.min(3,queue.length),0,cur);save();next();}
function render(){const td=dayStr();$('sk').textContent=S0.streak;$('bs').textContent=S0.best;$('du').textContent=DECK.filter(c=>S0.cards[c.id]&&S0.cards[c.id].due<=td).length;$('nw').textContent=S0.newToday;$('dn').textContent=S0.doneToday;
 $('codeBadge').textContent=code?('✓ '+code):t('guest');$('codeIn').value=code;$('d0').classList.toggle('active',!S0.dir);$('d1').classList.toggle('active',!!S0.dir);
 if(!cur){$('stage').innerHTML=`<p class="meaning-main">${t('allDone')}</p><button class="btn btn-outline" onclick="S0.extra+=10;save();buildQueue()">${t('more')}</button>`;return;}
 const c=S0.cards[cur.id];const mean=esc(cur[uiLang]||cur.en);const hm=`<div class="hmong-word">${esc(cur.hm)}</div>`;const me=`<div class="meaning-main">${mean}</div>`;
 $('stage').innerHTML=`<div class="card-badges"><span>${queue.length+1} ⏳</span><span class="badge">${t('box')} ${c?c.box:0}${c?'':' · NEW'}</span></div><div class="big-emoji">${cur.emo}</div>${S0.dir?me:hm}
 ${shown?`<hr style="border:none;border-top:1px solid var(--border)">${S0.dir?hm:me}${cur.tone?`<div class="mini line-tr">${esc(cur.tone)}</div>`:''}<div class="mark-row"><button class="btn btn-warn" onclick="grade(false)">${t('again')}</button><button class="btn btn-ok" onclick="grade(true)">${t('knew')}</button></div>`:`<div class="controls-row"><button class="btn big-play" onclick="shown=true;render()">${t('show')}</button></div>`}`;}
function setDir(d){S0.dir=d;save();render();}
function saveCode(){const v=$('codeIn').value.trim().toUpperCase().replace(/^HMONG-/,'HMOOB-');if(v&&!/^HMOOB-\d{2}$/.test(v)){$('codeIn').value='';return;}code=v;try{localStorage.setItem('hmong_student_code',code)}catch(e){}load();buildQueue();}
function resetAll(){if(confirm(t('confirmReset'))){try{localStorage.removeItem(key())}catch(e){}load();buildQueue();}}
function onLang(){if(S0)render();}
load();buildQueue();

setUILang(uiLang);
</script>
</body>
</html>
