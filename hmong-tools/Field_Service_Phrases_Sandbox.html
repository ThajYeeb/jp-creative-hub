<style>

  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 18px 14px 48px; line-height: 1.5; max-width: 960px; margin-left: auto; margin-right: auto; }
  .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .nav-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }

  .nav-links a.active { background: var(--accent); color: #fff; }
  .lang-switch { display: inline-flex; flex-wrap: wrap; background: #e2e8f0; border-radius: 999px; padding: 3px; gap: 2px; }
  .lang-btn { background: transparent; color: #334155; border: none; padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }

<script>
(function(){
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('themeToggleBtn');
    if (btn) {
      btn.innerHTML = t === 'dark' ? '☀️ Light' : '🌙 Dark';
      btn.title = t === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    }
  }
  window.toggleHmongTheme = function() {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('hmong_theme', next); } catch(e) {}
    applyTheme(next);
  };
  var saved = 'light';
  try {
    saved = localStorage.getItem('hmong_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch(e) {}
  applyTheme(saved);
  document.addEventListener('DOMContentLoaded', function() { applyTheme(saved); });
})();
</script>

urn": "🎤 あなたの番", "playMine": "▶ 自分の録音", "needsReview": "要確認", "score": "スコア", "streak": "連続", "next": "次へ →", "check": "確認", "reveal": "答えを見る", "correct": "正解！", "wrong": "惜しい！", "title": "🚪 野外奉仕フレーズ", "sub": "1行ずつ練習：講師（男性・女性）の音声を聞き、自分の声を録音して比べましょう。", "secG": "👋 あいさつ", "secP": "💬 短い証言", "secB": "📖 聖書研究", "hide": "モン語を隠す（自己テスト）", "lpNote": "「人々を愛する—弟子を作る」からのノートは後日講師が追加します。", "revNote": "「要確認」の行は講師の確認待ちの下書きです。"}};

const LANGS=['en','vi','ko','ja'];
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let uiLang=(function(){const q=new URLSearchParams(location.search).get('lang');if(LANGS.includes(q)){try{localStorage.setItem('hmong_ui_lang',q)}catch(e){}return q;}let s='en';try{s=localStorage.getItem('hmong_ui_lang')||'en'}catch(e){}return LANGS.includes(s)?s:'en';})();
function t(k){return (STR[uiLang]&&STR[uiLang][k]!=null)?STR[uiLang][k]:(STR.en[k]!=null?STR.en[k]:k);}
function L(o){if(!o)return '';if(typeof o==='string')return o;return o[uiLang]||o.en||'';}
function setUILang(l){if(!LANGS.includes(l))l='en';uiLang=l;try{localStorage.setItem('hmong_ui_lang',l)}catch(e){}document.documentElement.lang=l;
 LANGS.forEach(x=>{const b=$('btn'+x[0].toUpperCase()+x[1]);if(b)b.classList.toggle('active',x===l)});
 document.querySelectorAll('[data-i]').forEach(e=>{e.textContent=t(e.dataset.i)});
 document.querySelectorAll('[data-ip]').forEach(e=>{e.placeholder=t(e.dataset.ip)});
 document.title=t('title').replace(/^[^A-Za-z\u00C0-\uFFFF]+/,'')+' (Sandbox)';
 if(typeof onLang==='function')onLang();}
function studentCode(){let c='';const q=new URLSearchParams(location.search).get('code');try{c=(q||localStorage.getItem('hmong_student_code')||'')}catch(e){c=q||''}c=c.trim().toUpperCase().replace(/^HMONG-/,'HMOOB-');return /^HMOOB-\d{2}$/.test(c)?c:'';}
/* audio */
let curAudio=null;
function playUrl(u){try{if(curAudio)curAudio.pause();curAudio=new Audio(u);const p=curAudio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
/* recorder: audio/mp4 first for iPhone */
const REC_TYPES=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
let activeRec=null;
async function startRec(onDone,maxMs){
 if(activeRec){stopRec();return null;}
 const stream=await navigator.mediaDevices.getUserMedia({audio:true});
 const mt=(window.MediaRecorder&&MediaRecorder.isTypeSupported)?REC_TYPES.find(x=>MediaRecorder.isTypeSupported(x)):null;
 const mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
 const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 mr.onstop=()=>{stream.getTracks().forEach(tr=>tr.stop());const type=mr.mimeType||mt||(chunks[0]&&chunks[0].type)||'audio/mp4';activeRec=null;onDone(new Blob(chunks,{type}));};
 mr.start(250);activeRec={mr,timer:maxMs?setTimeout(stopRec,maxMs):null};return activeRec;}
function stopRec(){if(activeRec){clearTimeout(activeRec.timer);if(activeRec.mr.state!=='inactive')activeRec.mr.stop();}}
function blobToDataUrl(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
/* instructor clips (shared /api/phonetics-audio store) */
let CLIPS={};const CLIP_CACHE='hmong_sandbox_clips_cache';
try{CLIPS=JSON.parse(localStorage.getItem(CLIP_CACHE)||'{}')||{}}catch(e){CLIPS={}}
const STUDIO=new URLSearchParams(location.search).get('studio')==='1';
async function loadCloudClips(ids){try{const r=await fetch('/api/phonetics-audio',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(d&&d.ok&&d.clips){const keep={};for(const [id,v] of Object.entries(d.clips)){if(!ids||ids.includes(id))keep[id]={male:v.male||'',female:v.female||''};}CLIPS=Object.assign(CLIPS,keep);try{localStorage.setItem(CLIP_CACHE,JSON.stringify(CLIPS))}catch(e){}if(typeof onClips==='function')onClips();}}catch(e){}}
function hasClip(id,v){return !!(CLIPS[id]&&CLIPS[id][v]);}
function playClip(id,v){if(!v){v=hasClip(id,'female')?'female':'male';}if(hasClip(id,v))playUrl(CLIPS[id][v]);}
async function uploadClip(id,voice,label,blob,statusEl){
 const url=await blobToDataUrl(blob);if(url.length>95000){if(statusEl)statusEl.textContent=t('tooBig');return false;}
 if(!CLIPS[id])CLIPS[id]={male:'',female:''};CLIPS[id][voice]=url;try{localStorage.setItem(CLIP_CACHE,JSON.stringify(CLIPS))}catch(e){}
 if(statusEl)statusEl.textContent=t('uploading');
 try{const r=await fetch('/api/phonetics-audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,voice,label,audioDataUrl:url})});const d=await r.json();if(statusEl)statusEl.textContent=(d&&d.ok)?t('uploaded'):t('upFail');}catch(e){if(statusEl)statusEl.textContent=t('upFail');}
 if(typeof onClips==='function')onClips();return true;}
function clipButtons(id,label){
 let h='';['male','female'].forEach(v=>{h+=`<button class="btn btn-outline mini" ${hasClip(id,v)?'':'disabled style="opacity:.45"'} onclick="playClip('${id}','${v}')">▶ ${t(v)}</button>`;});
 if(STUDIO){h+=`<button class="btn btn-warn mini" onclick="studioRec(this,'${id}','male',${esc(JSON.stringify(label||id))})">${t('recMale')}</button><button class="btn btn-warn mini" onclick="studioRec(this,'${id}','female',${esc(JSON.stringify(label||id))})">${t('recFemale')}</button><span class="mini" id="st_${id}"></span>`;}
 return h;}
async function studioRec(btn,id,voice,label){const st=$('st_'+id);if(activeRec){stopRec();return;}
 try{btn.textContent=t('stop');await startRec(async b=>{btn.textContent=t(voice==='male'?'recMale':'recFemale');await uploadClip(id,voice,label,b,st);},4500);}catch(e){btn.textContent=t(voice==='male'?'recMale':'recFemale');if(st)st.textContent=t('micErr');}}
/* student "your turn" recorder (local only) */
const MY={};
async function myTurn(btn,key,playBtnId){if(activeRec){stopRec();return;}
 try{btn.textContent=t('stop');await startRec(b=>{btn.textContent=t('yourTurn');if(MY[key])URL.revokeObjectURL(MY[key]);MY[key]=URL.createObjectURL(b);const p=$(playBtnId);if(p){p.disabled=false;p.style.opacity=1;}},15000);}catch(e){btn.textContent=t('yourTurn');alert(t('micErr'));}}
function playMine(key){if(MY[key])playUrl(MY[key]);}

const ALL=SECS.flatMap(s=>s.items);
function render(){const hide=$('hide').checked;$('studioNote').innerHTML=STUDIO?`<div class="studio-bar">${t('studioOn')}</div>`:'';
 $('secs').innerHTML=SECS.map(s=>`<div class="panel"><h2 style="margin:0 0 6px;font-size:1.15rem;color:var(--accent)">${t(s.k)}</h2>${s.items.map(p=>`<div class="line-card"><div class="line-hm" ${hide?'style="filter:blur(7px)" onclick="this.style.filter=\'\'"':''}>${esc(p.hm)}${p.f?`<span class="review-flag">${t('needsReview')}</span>`:''}</div><div class="line-tr">${esc(L(p.m))}</div>
 <div class="btn-row">${clipButtons(p.id,p.hm)}</div>
