<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lub Cev / The Body (Sandbox)</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --accent: #1F4E79; --accent2: #2E75B6;
    --text: #1e293b; --muted: #64748b; --border: #cbd5e1;
    --ok-bg: #ecfdf5; --ok-border: #10b981; --warn-bg: #fffbeb; --warn-border: #f59e0b;
    --skin: #f0c4a0; --skin-stroke: #c48960; --hair: #4a3426;
    --board: #e8eef5;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 18px 14px 48px; line-height: 1.5; max-width: 1100px; margin-left: auto; margin-right: auto; }
  .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .nav-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .nav-links a { text-decoration: none; color: var(--accent); font-weight: 600; font-size: 0.9rem; background: #e2e8f0; padding: 6px 12px; border-radius: 8px; }
  .nav-links a.active { background: var(--accent); color: #fff; }
  .lang-switch { display: inline-flex; flex-wrap: wrap; background: #e2e8f0; border-radius: 999px; padding: 3px; gap: 2px; }
  .lang-btn { background: transparent; color: #334155; border: none; padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .panel { background: var(--card); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid #e2e8f0; }
  h1 { color: var(--accent); font-size: 1.45rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.92rem; margin: 0; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .btn:hover { background: var(--accent2); }
  .btn-outline { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
  .btn-outline.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-ok { background: #059669; color: #fff; }
  .btn-warn { background: #d97706; color: #fff; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .pill { background: #f1f5f9; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 0.84rem; font-weight: 600; cursor: pointer; color: #334155; }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .hidden { display: none !important; }
  .sb-tag { display:inline-block; font-size:0.7rem; font-weight:800; background:#fef3c7; color:#92400e; border-radius:6px; padding:2px 7px; vertical-align:middle; margin-left:6px; }
  .code-badge { display:inline-flex; align-items:center; gap:8px; background:var(--ok-bg); border:1px solid var(--ok-border); color:#065f46; border-radius:999px; padding:4px 12px; font-size:0.85rem; font-weight:700; }
  .code-badge.guest { background:#f1f5f9; border-color:var(--border); color:var(--muted); }
  .link-btn { background:none; border:none; color:var(--accent2); font-weight:600; cursor:pointer; padding:0 4px; font-size:0.82rem; text-decoration:underline; }
  .seg { display:flex; gap:4px; background:#e2e8f0; border-radius:10px; padding:3px; }
  .seg button { flex:1; border:none; background:transparent; padding:8px 8px; border-radius:8px; font-weight:700; font-size:0.88rem; cursor:pointer; color:var(--text); }
  .seg button.active { background:var(--accent); color:#fff; }
  .score-row{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0;align-items:center}
  .score-row .badge{font-size:.85rem;background:#e0f2fe;color:#0369a1;padding:3px 9px;border-radius:999px;font-weight:700}
  .lives { display:inline-flex; gap:4px; align-items:center; font-weight:800; color:#b45309; }
  .lives .pip { width:14px; height:14px; border-radius:50%; background:#f59e0b; box-shadow:0 0 0 2px #fde68a; }
  .lives .pip.off { background:#e2e8f0; box-shadow:none; }
  .mini{font-size:.8rem;padding:6px 10px}
  .btn-row{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
  .studio-bar{background:#fffbeb;border:1px dashed #f59e0b;border-radius:10px;padding:10px;margin-top:10px;font-size:.88rem}
  .feedback{margin-top:10px;padding:10px 12px;border-radius:10px;font-weight:600}
  .feedback.ok{background:var(--ok-bg);border:1px solid var(--ok-border)}
  .feedback.bad{background:#fef2f2;border:1px solid #ef4444}
  .theme-toggle-btn {
    background: #e2e8f0; color: #1e293b; border: 1px solid #cbd5e1;
    padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px; margin: 0;
  }
  .theme-toggle-btn:hover { background: #cbd5e1; }
  .sync-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-top:8px; }
  input[type="text"] { padding:8px 11px; border:1px solid var(--border); border-radius:8px; font-size:0.92rem; }
  .pair-note { font-size:0.84rem; color:var(--muted); margin-top:4px; }
  .hmong-word { font-size:2.4rem; font-weight:800; color:var(--accent); margin:4px 0; letter-spacing:0.3px; line-height:1.15; }
  .meaning-main { font-size:1.35rem; font-weight:700; color:#0f172a; margin:4px 0; }
  .prompt-box { text-align:center; padding:8px 4px 12px; }
  .quiz-choices { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
  .quiz-btn { padding:14px 10px; border-radius:10px; border:2px solid var(--border); background:#fff; font-weight:700; font-size:1.02rem; cursor:pointer; text-align:center; }
  .quiz-btn.correct { border-color:#10b981; background:#ecfdf5; color:#065f46; }
  .quiz-btn.wrong { border-color:#ef4444; background:#fef2f2; color:#991b1b; }

  .main { display:grid; grid-template-columns: 1.35fr .9fr; gap:14px; align-items:start; }
  .board {
    background: linear-gradient(180deg, #f8fafc, var(--board));
    border:2px solid var(--border); border-radius:16px; padding:10px 10px 14px;
    position:relative; transition: box-shadow .2s, transform .2s;
  }
  .board.buzz { animation: board-buzz .35s ease; box-shadow:0 0 0 5px #ef4444, 0 0 22px rgba(239,68,68,.45); }
  .board.glow-ok { box-shadow:0 0 0 5px #10b981, 0 0 22px rgba(16,185,129,.4); }
  @keyframes board-buzz {
    0%,100% { transform:translateX(0); }
    20% { transform:translateX(-8px); }
    40% { transform:translateX(8px); }
    60% { transform:translateX(-5px); }
    80% { transform:translateX(5px); }
  }
  .fig-grid { display:grid; gap:8px; align-items:start; }
  .fig-grid.n4 { grid-template-columns: 1fr 1fr; }
  .fig-grid.n3 { grid-template-columns: 1.1fr 1fr 1fr; }
  .fig-grid.n1 { grid-template-columns: minmax(0, 420px); justify-content:center; }
  .fig-grid.v-bones { grid-template-columns: minmax(0, 340px); }
  .fig-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:6px; }
  .fig-cap { font-size:.75rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; text-align:center; margin:0 0 2px; }
  .fig-img { position:relative; width:100%; border-radius:8px; overflow:hidden; background:#fff; touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-tap-highlight-color:transparent; }
  .fig-img img { display:block; width:100%; height:100%; object-fit:contain; pointer-events:none; }
  .hs-layer { position:absolute; inset:0; width:100%; height:100%; overflow:visible; }
  .part { cursor:pointer; outline:none; }
  .hs { fill:rgba(46,117,182,0); stroke:rgba(31,78,121,0); stroke-width:2; pointer-events:all; transition: fill .15s, stroke .15s; }
  @media (hover:hover) { .part:hover .hs { fill:rgba(46,117,182,.22); stroke:#1F4E79; stroke-dasharray:4 3; } }
  .part:focus-visible .hs { fill:rgba(46,117,182,.22); stroke:#1F4E79; }
  .part.lit .hs { fill:rgba(46,117,182,.32); stroke:#1F4E79; stroke-width:2.5; filter:drop-shadow(0 0 4px rgba(46,117,182,.9)); }
  .part.ok .hs { fill:rgba(16,185,129,.38); stroke:#059669; stroke-width:3; filter:drop-shadow(0 0 5px #10b981); }
  .part.bad .hs { fill:rgba(239,68,68,.38); stroke:#dc2626; stroke-width:3; filter:drop-shadow(0 0 5px #ef4444); }
  .part[data-id="skin"].lit .hs, .part[data-id="skin"].ok .hs, .part[data-id="skin"].bad .hs { fill-opacity:.55; }
  .pin-line { stroke:#94a3b8; stroke-width:1.5; stroke-dasharray:3 3; }
  .pin { position:absolute; transform:translate(-50%,-50%); width:clamp(26px, 15%, 40px); aspect-ratio:1; border-radius:50%; border:2px solid #94a3b8; background:#fff; font-size:clamp(13px, 2.2vw, 20px); line-height:1; padding:0; display:flex; align-items:center; justify-content:center; box-shadow:0 1px 4px rgba(0,0,0,.18); transition: box-shadow .15s, border-color .15s; }
  @media (hover:hover) { .pin:hover { border-color:#1F4E79; box-shadow:0 0 0 3px rgba(46,117,182,.35); } }
  .pin.lit { border-color:#1F4E79; box-shadow:0 0 0 4px rgba(46,117,182,.5), 0 0 10px rgba(46,117,182,.8); }
  .pin.ok { border-color:#059669; box-shadow:0 0 0 4px rgba(16,185,129,.55), 0 0 12px #10b981; }
  .pin.bad { border-color:#dc2626; box-shadow:0 0 0 4px rgba(239,68,68,.55), 0 0 12px #ef4444; }
  .word-bank { display:flex; flex-wrap:wrap; gap:6px; max-height:260px; overflow:auto; margin-top:8px; }
  .word-bank button { background:#f8fafc; border:1px solid var(--border); border-radius:8px; padding:6px 8px; font-size:.8rem; font-weight:700; cursor:pointer; color:var(--text); }
  .word-bank button.active { background:var(--accent); color:#fff; border-color:var(--accent); }
  .word-bank button .g { display:block; font-weight:600; font-size:.7rem; color:var(--muted); }
  .word-bank button.active .g { color:#dbeafe; }

  html[data-theme="dark"] {
    --bg: #0f172a; --card: #1e293b; --accent: #60a5fa; --accent2: #3b82f6;
    --text: #f1f5f9; --muted: #94a3b8; --border: #334155;
    --ok-bg: #064e3b; --ok-border: #10b981; --warn-bg: #451a03; --warn-border: #f59e0b;
    --skin: #c99572; --skin-stroke: #8a5a3c; --hair: #1f140e; --board: #0f172a;
    color-scheme: dark;
  }
  html[data-theme="dark"] body { background: var(--bg); color: var(--text); }
  html[data-theme="dark"] .panel, html[data-theme="dark"] .fig-card, html[data-theme="dark"] .quiz-btn:not(.correct):not(.wrong) {
    background: var(--card) !important; color: var(--text) !important; border-color: var(--border) !important;
  }
  html[data-theme="dark"] .lang-switch, html[data-theme="dark"] .seg { background: #334155 !important; }
  html[data-theme="dark"] .lang-btn { color: #cbd5e1 !important; }
  html[data-theme="dark"] .lang-btn.active { background: #2563eb !important; color: #fff !important; }
  html[data-theme="dark"] .pill, html[data-theme="dark"] .btn-outline:not(.active), html[data-theme="dark"] .nav-links a:not(.active), html[data-theme="dark"] .word-bank button:not(.active), html[data-theme="dark"] .theme-toggle-btn {
    background: #334155 !important; color: #f1f5f9 !important; border-color: #475569 !important;
  }
  html[data-theme="dark"] .meaning-main, html[data-theme="dark"] p { color: #cbd5e1 !important; }
  html[data-theme="dark"] .code-badge { color:#a7f3d0; }
  html[data-theme="dark"] .code-badge.guest { color:#94a3b8; background:#0f172a; }
  html[data-theme="dark"] .score-row .badge { background:#1e3a8a; color:#bfdbfe; }
  html[data-theme="dark"] .feedback.bad { background:#450a0a; }
  html[data-theme="dark"] .studio-bar { background:#2e2310; color:#fde68a; border-color:#b45309; }
  html[data-theme="dark"] input { background:#0f172a; color:#f1f5f9; border-color:#475569; }
  html[data-theme="dark"] .board { background: linear-gradient(180deg, #1e293b, #0f172a); }
  html[data-theme="dark"] table, html[data-theme="dark"] th, html[data-theme="dark"] td { border-color:#334155; color:#e2e8f0; }
  html[data-theme="dark"] th { background:#0f172a; }
  html[data-theme="dark"] .fig-card { background:#f8fafc !important; }
  html[data-theme="dark"] .fig-cap { color:#334155; }

  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
    .hmong-word { font-size:2rem; }
    body { padding:12px 10px 40px; }
    .nav-links a { font-size:0.8rem; padding:5px 9px; }
    .quiz-choices { grid-template-columns:1fr; }
  }
  @media (max-width: 520px) {
    .fig-grid.n3 { grid-template-columns: 1fr 1fr; }
    .fig-grid.n3 .fig-card:first-child { grid-row: span 2; }
    .board { padding:6px; }
  }
</style>
<script>
(function(){
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('themeToggleBtn');
    if (btn) {
      btn.innerHTML = t === 'dark' ? '☀️ Light' : '🌙 Dark';
      btn.title = t === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    }
  }
  window.toggleHmongTheme = function() {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('hmong_theme', next); } catch(e) {}
    applyTheme(next);
  };
  var saved = 'light';
  try {
    saved = localStorage.getItem('hmong_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch(e) {}
  applyTheme(saved);
  document.addEventListener('DOMContentLoaded', function() { applyTheme(saved); });
})();
</script>

<script>

/* audio */
let curAudio=null;
function playUrl(u){try{if(curAudio)curAudio.pause();curAudio=new Audio(u);const p=curAudio.play();if(p&&p.catch)p.catch(()=>{});}catch(e){}}
const REC_TYPES=['audio/mp4','audio/webm;codecs=opus','audio/webm','audio/ogg'];
let activeRec=null;
async function startRec(onDone,maxMs){
  if(activeRec){stopRec();return null;}
  const stream=await navigator.mediaDevices.getUserMedia({audio:true});
  const mt=(window.MediaRecorder&&MediaRecorder.isTypeSupported)?REC_TYPES.find(x=>MediaRecorder.isTypeSupported(x)):null;
  const mr=mt?new MediaRecorder(stream,{mimeType:mt}):new MediaRecorder(stream);
  const chunks=[];mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=()=>{stream.getTracks().forEach(tr=>tr.stop());const type=mr.mimeType||mt||(chunks[0]&&chunks[0].type)||'audio/mp4';activeRec=null;onDone(new Blob(chunks,{type}));};
  mr.start(250);activeRec={mr,timer:maxMs?setTimeout(stopRec,maxMs):null};return activeRec;
}
function stopRec(){if(activeRec){clearTimeout(activeRec.timer);if(activeRec.mr.state!=='inactive')activeRec.mr.stop();}}
function blobToDataUrl(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b);});}
let CLIPS={};const CLIP_CACHE='hmong_sandbox_clips_cache';
try{CLIPS=JSON.parse(localStorage.getItem(CLIP_CACHE)||'{}')||{}}catch(e){CLIPS={}}
const STUDIO=new URLSearchParams(location.search).get('studio')==='1';
async function loadCloudClips(ids){try{const r=await fetch('/api/phonetics-audio',{cache:'no-store'});if(!r.ok)return;const d=await r.json();if(d&&d.ok&&d.clips){const keep={};for(const [id,v] of Object.entries(d.clips)){if(!ids||ids.includes(id))keep[id]={male:v.male||'',female:v.female||''};}CLIPS=Object.assign(CLIPS,keep);try{localStorage.setItem(CLIP_CACHE,JSON.stringify(CLIPS))}catch(e){}if(typeof onClips==='function')onClips();}}catch(e){}}
function hasClip(id,v){return !!(CLIPS[id]&&CLIPS[id][v]);}
function playClip(id,v){if(!v){v=hasClip(id,'female')?'female':'male';}if(hasClip(id,v))playUrl(CLIPS[id][v]);}
function clipId(p){return 'body_'+p.id;}
async function uploadClip(id,voice,label,blob,statusEl){
  const url=await blobToDataUrl(blob);if(url.length>95000){if(statusEl)statusEl.textContent=t('tooBig');return false;}
  if(!CLIPS[id])CLIPS[id]={male:'',female:''};CLIPS[id][voice]=url;try{localStorage.setItem(CLIP_CACHE,JSON.stringify(CLIPS))}catch(e){}
  if(statusEl)statusEl.textContent=t('uploading');
  try{const r=await fetch('/api/phonetics-audio',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id,voice,label,audioDataUrl:url})});const d=await r.json();if(statusEl)statusEl.textContent=(d&&d.ok)?t('uploaded'):t('upFail');}catch(e){if(statusEl)statusEl.textContent=t('upFail');}
  if(typeof onClips==='function')onClips();return true;
}
function clipButtons(id,label){
  let h='';['male','female'].forEach(v=>{h+=`<button class="btn btn-outline mini" ${hasClip(id,v)?'':'disabled style="opacity:.45"'} onclick="playClip('${id}','${v}')">▶ ${t(v)}</button>`;});
  if(STUDIO){h+=`<button class="btn btn-warn mini" onclick="studioRec(this,'${id}','male',${esc(JSON.stringify(label||id))})">${t('recMale')}</button><button class="btn btn-warn mini" onclick="studioRec(this,'${id}','female',${esc(JSON.stringify(label||id))})">${t('recFemale')}</button><span class="mini" id="st_${id}"></span>`;}
  return h;
}
async function studioRec(btn,id,voice,label){const st=$('st_'+id);if(activeRec){stopRec();return;}
  try{btn.textContent=t('stop');await startRec(async b=>{btn.textContent=t(voice==='male'?'recMale':'recFemale');await uploadClip(id,voice,label,b,st);},4500);}catch(e){btn.textContent=t(voice==='male'?'recMale':'recFemale');if(st)st.textContent=t('micErr');}}

function buzzSound(ok){
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=ok?'sine':'sawtooth';
    o.frequency.value=ok?880:130;
    g.gain.value=ok?0.08:0.12;
    o.connect(g); g.connect(ctx.destination);
    o.start();
    if(ok){ o.frequency.exponentialRampToValueAtTime(1320, ctx.currentTime+0.12); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.28); o.stop(ctx.currentTime+0.3); }
    else { setTimeout(()=>{o.frequency.value=90;},90); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime+0.35); o.stop(ctx.currentTime+0.38); }
  }catch(e){}
}

function byId(id){return PARTS.find(p=>p.id===id);}
function sameHm(p){return PARTS.filter(x=>x.hm===p.hm);}
function inDiagram(p, diagram){return p.diagram===diagram || p.diagram==='both';}
function visibleParts(){
  const diagram=st.diagram;
  const view=diagram==='outside'?st.view:st.insideView;
  return PARTS.filter(p=>inDiagram(p,diagram) && p.views.includes(view));
}
function uniqueVisible(){
  const seen=new Set(); const out=[];
  visibleParts().forEach(p=>{ if(!seen.has(p.hm)){ seen.add(p.hm); out.push(p); } });
  return out;
}

function shapeSVG(s){
  const [id,kind]=s;
  if(kind==='e') return `<ellipse class="vis hs" vector-effect="non-scaling-stroke" cx="${s[2]}" cy="${s[3]}" rx="${s[4]}" ry="${s[5]}"/>`;
  if(kind==='p') return `<polygon class="vis hs" vector-effect="non-scaling-stroke" points="${s[2].map(pt=>pt.join(',')).join(' ')}"/>`;
  return '';
}
function panelHTML(key){
  const P=PANELS[key]; const list=SHAPES[key]||[];
  /* group consecutive shapes by id, keep z-order */
  let svg=''; let pins='';
  list.forEach(s=>{
    const p=byId(s[0]); const label=p?p.hm:s[0];
    if(s[1]==='pin'){
      svg+=`<line class="pin-line" data-for="${s[0]}" x1="${s[2]}" y1="${s[3]}" x2="${s[5]}" y2="${s[6]}" vector-effect="non-scaling-stroke"/>`;
      pins+=`<button type="button" class="part pin" data-id="${s[0]}" aria-label="${esc(label)}" style="left:${s[2]}%;top:${s[3]}%">${s[4]}</button>`;
    } else {
      svg+=`<g class="part" data-id="${s[0]}" role="button" tabindex="0" aria-label="${esc(label)}">${shapeSVG(s)}</g>`;
    }
  });
  return `<div class="fig-card fig-${key}"><div class="fig-cap">${esc(t(P.cap))}</div>
    <div class="fig-img" style="aspect-ratio:${P.w}/${P.h}">
      <img src="${IMG_BASE+P.img}" width="${P.w}" height="${P.h}" alt="${esc(t(P.cap))}" draggable="false" decoding="async">
      <svg class="hs-layer" viewBox="0 0 100 100" preserveAspectRatio="none" aria-label="${esc(t(P.cap))}">${svg}</svg>
      ${pins}
    </div></div>`;
}

function renderDiagram(){
  const stage=$('diagramStage');
  const view=st.diagram==='inside'?st.insideView:st.view;
  const panels=VIEW_PANELS[view]||[];
  stage.innerHTML=`<div class="fig-grid n${panels.length} v-${view}">${panels.map(panelHTML).join('')}</div>`;
  bindDiagram();
  highlight(selected, '');
}

function bindDiagram(){
  const root=$('diagramStage');
  root.querySelectorAll('.part').forEach(g=>{
    g.addEventListener('click', ev=>{ ev.stopPropagation(); onPart(g.getAttribute('data-id')); });
    g.addEventListener('keydown', ev=>{ if(ev.key==='Enter'||ev.key===' '){ ev.preventDefault(); onPart(g.getAttribute('data-id')); }});
  });
}

function highlight(id, cls){
  document.querySelectorAll('.part').forEach(g=>{
    g.classList.remove('lit','ok','bad');
    if(id && g.getAttribute('data-id')===id) g.classList.add(cls||'lit');
    else if(id){
      const a=byId(id), b=byId(g.getAttribute('data-id'));
      if(a && b && a.hm===b.hm) g.classList.add(cls||'lit');
    }
  });
  document.querySelectorAll('.word-bank button').forEach(b=>{
    b.classList.toggle('active', !!id && (b.dataset.id===id || (byId(id)&&byId(b.dataset.id)&&byId(id).hm===byId(b.dataset.id).hm)));
  });
}

function flashBoard(ok){
  const b=$('board');
  b.classList.remove('buzz','glow-ok');
  void b.offsetWidth;
  b.classList.add(ok?'glow-ok':'buzz');
  setTimeout(()=>b.classList.remove('buzz','glow-ok'), 600);
}

function ensureViewFor(p){
  if(!p)return;
  if(p.diagram==='inside' || (p.diagram==='both' && st.diagram==='inside')){
    st.diagram='inside';
    if(!p.views.includes(st.insideView)) st.insideView=p.views.find(v=>v==='organs'||v==='bones')||p.views[0];
  } else {
    st.diagram='outside';
    if(!p.views.includes(st.view)) st.view=p.views.includes('front')?'front':p.views[0];
  }
}

function playPart(p){ if(!p)return; const id=clipId(p); if(hasClip(id,'female')||hasClip(id,'male')) playClip(id); }

function showInfo(p){
  if(!p){ $('prompt').innerHTML=`<p class="sub">${esc(t('tapHint'))}</p>`; $('playRow').innerHTML=''; return; }
  $('prompt').innerHTML=`<div class="hmong-word">${esc(p.hm)}</div><div class="meaning-main">${esc(glossAll(p))}</div>${p.pair?`<div class="pair-note">${esc(t('pairNote'))}</div>`:''}`;
  $('playRow').innerHTML=clipButtons(clipId(p), p.hm);
}

function renderBank(){
  const wrap=$('bankWrap');
  if(st.mode!=='explore'){ wrap.classList.add('hidden'); return; }
  wrap.classList.remove('hidden');
  const list=uniqueVisible();
  $('bank').innerHTML=list.map(p=>`<button type="button" data-id="${p.id}" onclick="onPart('${p.id}')">${esc(p.hm)}<span class="g">${esc(glossAll(p))}${p.id==='skin'?' — '+t('skinBtn'):''}</span></button>`).join('');
}

function renderScore(){
  $('sc').textContent=st.c+'/'+st.n;
  $('sk').textContent=st.s;
  $('best').textContent=st.best||0;
  const live=st.mode==='find';
  $('livesRow').classList.toggle('hidden', !live);
  if(live){
    const n=Math.max(0, st.lives);
    $('livesRow').innerHTML=`<span>${esc(t('lives'))}</span> `+[0,1,2].map(i=>`<span class="pip ${i<n?'':'off'}"></span>`).join('');
  }
}

function renderControls(){
  $('diagramSeg').innerHTML=[['outside','outside'],['inside','inside']].map(([k,l])=>`<button class="${st.diagram===k?'active':''}" onclick="setDiagram('${k}')">${t(l)}</button>`).join('');
  $('modeSeg').innerHTML=[['explore','explore'],['find','findIt'],['rev','whichWord']].map(([k,l])=>`<button class="${st.mode===k?'active':''}" onclick="setMode('${k}')">${t(l)}</button>`).join('');
  if(st.diagram==='outside'){
    $('viewPills').innerHTML=[['front','front'],['back','back']].map(([k,l])=>`<button class="pill ${st.view===k?'active':''}" onclick="setView('${k}')">${t(l)}</button>`).join('');
  } else {
    $('viewPills').innerHTML=[['organs','organs'],['bones','bones']].map(([k,l])=>`<button class="pill ${st.insideView===k?'active':''}" onclick="setInside('${k}')">${t(l)}</button>`).join('');
  }
}

function setDiagram(d){ st.diagram=d; if(st.mode==='explore') selected=null; save(); if(st.mode!=='explore') newQ(); else renderAll(); }
function setView(v){ st.view=v; save(); if(st.mode!=='explore') newQ(); else renderAll(); }
function setInside(v){ st.insideView=v; save(); if(st.mode!=='explore') newQ(); else renderAll(); }
function setMode(m){ st.mode=m; selected=null; answered=false; gameOver=false; if(m==='find' && (st.lives||0)<=0) st.lives=3; save(); if(m==='explore'){ q=null; renderAll(); } else newQ(); }

function onPart(id){
  const p=byId(id); if(!p)return;
  if(st.mode==='explore'){
    selected=id;
    if(p.diagram==='inside' && st.diagram!=='inside'){ st.diagram='inside'; }
    if(p.diagram==='outside' && st.diagram!=='outside'){ st.diagram='outside'; }
    if(!p.views.includes(st.diagram==='outside'?st.view:st.insideView) && p.diagram!=='both'){
      if(st.diagram==='outside') st.view=p.views.includes('front')?'front':p.views[0];
      else st.insideView=p.views[0];
      renderDiagram(); renderControls();
    }
    highlight(id,'lit'); showInfo(p); playPart(p); renderBank();
    return;
  }
  if(st.mode==='find'){ tapFind(id); return; }
  /* reverse mode ignores body taps */
}

function matchPart(id, target){
  if(!target)return false;
  if(id===target.id) return true;
  const p=byId(id);
  return !!(p && p.hm===target.hm);
}

function score(ok){
  st.n++;
  if(ok){ st.c++; st.s++; if(st.s>(st.best||0)) st.best=st.s; }
  else { st.s=0; if(st.mode==='find') st.lives=Math.max(0,(st.lives||3)-1); }
  save(); answered=true; renderScore();
}

function newQ(){
  const pool=uniqueVisible();
  if(!pool.length){ q=null; renderAll(); return; }
  let pick=pool[Math.floor(Math.random()*pool.length)];
  if(q && pool.length>1){ let g=0; while(pick.hm===q.hm && g++<20) pick=pool[Math.floor(Math.random()*pool.length)]; }
  q=pick; answered=false; gameOver=false;
  const seen=new Set([q.hm]); opts=[q];
  const all=PARTS.filter(p=>inDiagram(p, st.diagram));
  /* unique by hm */
  const uniq=[]; const u=new Set();
  all.forEach(p=>{ if(!u.has(p.hm)){ u.add(p.hm); uniq.push(p); } });
  let guard=0;
  while(opts.length<4 && guard++<80){
    const o=uniq[Math.floor(Math.random()*uniq.length)];
    if(!seen.has(o.hm)){ seen.add(o.hm); opts.push(o); }
  }
  opts.sort(()=>Math.random()-.5);
  selected = st.mode==='rev'?q.id:null;
  if(st.mode==='find'){ ensureViewFor(q); }
  renderAll(true);
  if(st.mode==='find') playPart(q);
}

function tapFind(id){
  if(answered || gameOver || !q)return;
  const ok=matchPart(id,q);
  score(ok); buzzSound(ok); flashBoard(ok);
  highlight(ok?id:q.id, ok?'ok':'');
  if(!ok){ highlight(id,'bad'); setTimeout(()=>highlight(q.id,'ok'), 350); }
  const over=st.mode==='find' && st.lives<=0;
  if(over) gameOver=true;
  $('out').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✅ '+t('correct'):'❌ '+(t('buzz')+' — '+t('wrong'))} <b>${esc(q.hm)}</b> · ${esc(glossAll(q))}${over?'<div style="margin-top:6px">'+esc(t('gameOver'))+'</div>':''}
    <div class="btn-row" style="justify-content:center;margin-top:8px"><button class="btn" onclick="${over?'resetGame()':'newQ()'}">${over?t('playAgain'):t('next')}</button></div></div>`;
}

function tapChoice(i){
  if(answered||!q)return;
  const ok=opts[i].hm===q.hm;
  score(ok); buzzSound(ok); flashBoard(ok);
  $('answer').querySelectorAll('.quiz-btn').forEach((b,k)=>{
    if(opts[k].hm===q.hm) b.classList.add('correct');
    else if(k===i) b.classList.add('wrong');
  });
  highlight(q.id, ok?'ok':'ok');
  $('out').innerHTML=`<div class="feedback ${ok?'ok':'bad'}">${ok?'✅ '+t('correct'):'❌ '+t('wrong')} <b>${esc(q.hm)}</b>
    <div class="btn-row" style="justify-content:center;margin-top:8px"><button class="btn" onclick="newQ()">${t('next')}</button></div></div>`;
}

function resetGame(){ st.lives=3; st.c=0; st.n=0; st.s=0; save(); gameOver=false; newQ(); }

function renderAll(keepQ){
  renderControls(); renderScore(); renderDiagram(); renderBank();
  $('studioNote').innerHTML=STUDIO?`<div class="studio-bar">${t('studioOn')}</div>`:'';
  $('out').innerHTML='';
  if(st.mode==='explore'){
    $('answer').innerHTML='';
    if(selected){ const p=byId(selected); highlight(selected,'lit'); showInfo(p); }
    else showInfo(null);
  } else if(st.mode==='find'){
    if(!q){ $('prompt').innerHTML=''; return; }
    $('prompt').innerHTML=`<div class="sub">${esc(t('findPrompt'))}</div><div class="hmong-word">${esc(q.hm)}</div><div class="meaning-main">${esc(glossAll(q))}</div>`;
    $('playRow').innerHTML=clipButtons(clipId(q), q.hm)+(hasClip(clipId(q),'male')||hasClip(clipId(q),'female')?` <button class="btn btn-outline mini" onclick="playPart(q)">${t('hearAgain')}</button>`:'');
    $('answer').innerHTML='';
  } else {
    if(!q){ $('prompt').innerHTML=''; return; }
    highlight(q.id,'lit');
    $('prompt').innerHTML=`<div class="sub">${esc(t('pickWord'))}</div>`;
    $('playRow').innerHTML='';
    $('answer').innerHTML=`<div class="quiz-choices">${opts.map((o,i)=>`<button class="quiz-btn" onclick="tapChoice(${i})">${esc(o.hm)}<div class="mini" style="font-weight:600;color:var(--muted)">${esc(glossAll(o))}</div></button>`).join('')}</div>`;
  }
  renderRef();
}

function renderRef(){
  const groups=[['outside', PARTS.filter(p=>p.diagram==='outside'||p.diagram==='both')],['inside', PARTS.filter(p=>p.diagram==='inside'||p.diagram==='both')]];
  let html='';
  groups.forEach(([lab,list])=>{
    const uniq=[]; const seen=new Set();
    list.forEach(p=>{ if(!seen.has(p.hm)){ seen.add(p.hm); uniq.push(p); } });
    html+=`<h3 style="color:var(--accent);font-size:1rem;margin:12px 0 6px">${esc(t(lab))}</h3>`;
    html+=`<table style="width:100%;border-collapse:collapse">${uniq.map(p=>`<tr>
      <td style="padding:6px;border-bottom:1px solid var(--border);width:38%"><b style="color:var(--accent)">${esc(p.hm)}</b></td>
      <td style="padding:6px;border-bottom:1px solid var(--border)">${esc(glossAll(p))}</td>
      <td style="padding:6px;border-bottom:1px solid var(--border)">${clipButtons(clipId(p),p.hm)}</td>
    </tr>`).join('')}</table>`;
  });
  /* eyebrow/eyelash share a word — note in reference only once, gloss already joined? unique by hm uses first (eyebrow). Let's join glosses. */
  $('ref').innerHTML=html;
}

function onClips(){ if(st.mode==='explore' && selected) showInfo(byId(selected)); else if(q && st.mode==='find') $('playRow').innerHTML=clipButtons(clipId(q), q.hm); renderRef(); }
function onLang(){ renderAll(); }

loadState();
(function applyQuery(){
  const qs=new URLSearchParams(location.search);
  const m=qs.get('mode'); if(m==='find'||m==='rev'||m==='explore') st.mode=m;
  const d=qs.get('diagram'); if(d==='inside'||d==='outside') st.diagram=d;
  const v=qs.get('view'); if(v==='back'||v==='front') st.view=v;
  const iv=qs.get('inside'); if(iv==='bones'||iv==='organs') st.insideView=iv;
  const part=qs.get('part'); if(part&&byId(part)) selected=part;
})();
setUILang(uiLang);
if(st.mode==='explore'){ renderAll(); if(selected) onPart(selected); } else newQ();
loadCloudClips(null);
</script>
</body>
</html>
