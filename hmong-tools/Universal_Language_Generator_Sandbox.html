<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Universal Language Generator – SANDBOX</title>
<style>
  :root {
    --bg: #f4f6f9; --card: #ffffff; --accent: #1F4E79; --accent2: #2E75B6;
    --text: #1e293b; --muted: #64748b; --border: #cbd5e1;
    --ok-bg: #ecfdf5; --ok-border: #10b981; --warn-bg: #fffbeb; --warn-border: #f59e0b;
  }
  * { box-sizing: border-box; }
  body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 18px 14px 48px; line-height: 1.5; max-width: 960px; margin-left: auto; margin-right: auto; }
  .top-bar { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 14px; }
  .nav-links { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .nav-links a { text-decoration: none; color: var(--accent); font-weight: 600; font-size: 0.9rem; background: #e2e8f0; padding: 6px 12px; border-radius: 8px; }
  .nav-links a.active { background: var(--accent); color: #fff; }
  .lang-switch { display: inline-flex; flex-wrap: wrap; background: #e2e8f0; border-radius: 999px; padding: 3px; gap: 2px; }
  .lang-btn { background: transparent; color: #334155; border: none; padding: 6px 12px; border-radius: 999px; font-size: 0.85rem; font-weight: 700; cursor: pointer; }
  .lang-btn.active { background: var(--accent); color: #fff; }
  .panel { background: var(--card); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); border: 1px solid #e2e8f0; }
  h1 { color: var(--accent); font-size: 1.45rem; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 0.92rem; margin: 0; }
  .sync-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 8px; }
  input[type="text"], select { padding: 8px 11px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.92rem; }
  .btn { background: var(--accent); color: #fff; border: none; padding: 8px 14px; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 0.9rem; }
  .btn:hover { background: var(--accent2); }
  .btn-outline { background: #f1f5f9; color: var(--text); border: 1px solid var(--border); }
  .btn-outline.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn-ok { background: #059669; color: #fff; }
  .btn-warn { background: #d97706; color: #fff; }
  .pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0; }
  .pill { background: #f1f5f9; border: 1px solid var(--border); border-radius: 999px; padding: 5px 12px; font-size: 0.84rem; font-weight: 600; cursor: pointer; color: #334155; }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .stage-wrap { perspective: 1100px; max-width: 560px; margin: 14px auto; }
  .flashcard { width: 100%; min-height: 350px; background: #fff; border-radius: 16px; border: 2px solid var(--accent2); box-shadow: 0 8px 24px rgba(31,78,121,0.12); padding: 22px; display: flex; flex-direction: column; align-items: center; justify-content: space-between; text-align: center; cursor: pointer; transition: transform 0.18s ease, box-shadow 0.18s ease; position: relative; }
  .flashcard:hover { box-shadow: 0 12px 28px rgba(31,78,121,0.18); }
  .card-badges { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 0.8rem; color: var(--muted); font-weight: 600; }
  .badge { background: #e0f2fe; color: #0369a1; padding: 3px 9px; border-radius: 999px; }
  .visual-box { width: 220px; height: 155px; border-radius: 12px; background: #f8fafc; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; margin: 10px 0; position: relative; }
  .visual-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .visual-emoji { font-size: 4rem; line-height: 1; }
  .hmong-word { font-size: 2.2rem; font-weight: 800; color: var(--accent); margin: 4px 0; letter-spacing: 0.3px; }
  .meaning-main { font-size: 1.45rem; font-weight: 700; color: #0f172a; margin: 4px 0; }
  .gloss-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; width: 100%; margin-top: 8px; text-align: left; font-size: 0.84rem; background: #f8fafc; padding: 8px 10px; border-radius: 8px; border: 1px solid #e2e8f0; }
  .controls-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 12px; }
  .add-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-top: 10px; }
  .preview-strip { display: flex; align-items: center; gap: 12px; margin-top: 10px; padding: 10px; background: #f8fafc; border-radius: 10px; border: 1px dashed var(--border); }
  .preview-thumb { width: 72px; height: 72px; border-radius: 8px; background: #fff; border: 1px solid #e2e8f0; display: flex; align-items: center; justify-content: center; overflow: hidden; font-size: 2.2rem; flex-shrink: 0; }
  .preview-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .quiz-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; width: 100%; margin-top: 12px; }
  .quiz-btn { padding: 12px; border-radius: 10px; border: 2px solid var(--border); background: #fff; font-weight: 600; font-size: 0.96rem; cursor: pointer; text-align: left; }
  .quiz-btn.correct { border-color: #10b981; background: #ecfdf5; color: #065f46; }
  .quiz-btn.wrong { border-color: #ef4444; background: #fef2f2; color: #991b1b; }
  .hidden { display: none !important; }

  /* Shared Light / Dark Mode Theme Overrides */
  html[data-theme="dark"] {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #60a5fa;
    --accent2: #3b82f6;
    --accent-soft: #1e3a5f;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --border: #334155;
    --male-bg: #1e3a8a;
    --male-border: #3b82f6;
    --male-text: #bfdbfe;
    --fem-bg: #831843;
    --fem-border: #ec4899;
    --fem-text: #fbcfe8;
    --ok-bg: #064e3b;
    --ok-border: #10b981;
    --warn-bg: #451a03;
    --warn-border: #f59e0b;
    --err-bg: #450a0a;
    --err-border: #ef4444;
    color-scheme: dark;
  }
  html[data-theme="dark"] body { background: var(--bg); color: var(--text); }
  html[data-theme="dark"] .card,
  html[data-theme="dark"] .panel,
  html[data-theme="dark"] .sound-card,
  html[data-theme="dark"] .flashcard {
    background: var(--card) !important;
    color: var(--text) !important;

  }
  html[data-theme="dark"] .lang-switch { background: #334155 !important; }
  html[data-theme="dark"] .lang-btn { color: #cbd5e1 !important; }
  html[data-theme="dark"] .lang-btn.active { background: #2563eb !important; color: #fff !important; }
  html[data-theme="dark"] .tone,
  html[data-theme="dark"] .sc-example,
  html[data-theme="dark"] .gloss-grid,
  html[data-theme="dark"] .preview-strip,
  html[data-theme="dark"] .visual-box,
  html[data-theme="dark"] .speed-box,
  html[data-theme="dark"] .sentence-box,
  html[data-theme="dark"] .slot-col,
  html[data-theme="dark"] .pair span,
  html[data-theme="dark"] .sc-glyph {
    background: #0f172a !important;
    color: var(--text) !important;
    border-color: var(--border) !important;
  }
  html[data-theme="dark"] .sc-ipa,
  html[data-theme="dark"] .pill,
  html[data-theme="dark"] .tab-btn:not(.active),
  html[data-theme="dark"] button.secondary,
  html[data-theme="dark"] .btn-outline:not(.active),
  html[data-theme="dark"] .nav-links a:not(.active),
  html[data-theme="dark"] .quiz-btn:not(.correct):not(.wrong) {
    background: #334155 !important;
    color: #f1f5f9 !important;
    border-color: #475569 !important;
  }
  html[data-theme="dark"] .formula-banner {
    background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%) !important;
    border-color: #3b82f6 !important;
    color: #e2e8f0 !important;
  }
  html[data-theme="dark"] .formula-banner div { color: #cbd5e1 !important; }
  html[data-theme="dark"] .f-chip {
    background: #0f172a !important;
    color: #93c5fd !important;
    border-color: #3b82f6 !important;
  }
  html[data-theme="dark"] .note,
  html[data-theme="dark"] .studio-panel,
  html[data-theme="dark"] .studio-card-controls {
    background: #2e2310 !important;
    color: #fde68a !important;
    border-color: #b45309 !important;
  }
  html[data-theme="dark"] .studio-panel strong,
  html[data-theme="dark"] .studio-panel div,
  html[data-theme="dark"] .studio-card-controls span {
    color: #fde68a !important;
  }
  html[data-theme="dark"] input,
  html[data-theme="dark"] select,
  html[data-theme="dark"] textarea {
    background: #0f172a !important;
    color: #f1f5f9 !important;
    border-color: #475569 !important;
  }
  html[data-theme="dark"] table,
  html[data-theme="dark"] th,
  html[data-theme="dark"] td {
    border-color: #334155 !important;
    color: #e2e8f0 !important;
  }
  html[data-theme="dark"] th { background: #0f172a !important; }
  html[data-theme="dark"] tr:nth-child(even) { background: rgba(255,255,255,0.03) !important; }
  html[data-theme="dark"] .meaning-main,
  html[data-theme="dark"] .sc-tip,
  html[data-theme="dark"] .research,
  html[data-theme="dark"] p {
    color: #cbd5e1 !important;
  }
  html[data-theme="dark"] .play-btn.both-btn {
    background: #064e3b !important;
    color: #a7f3d0 !important;
    border-color: #059669 !important;
  }
  .theme-toggle-btn {
    background: #e2e8f0;
    color: #1e293b;
    border: 1px solid #cbd5e1;
    padding: 6px 12px;
    border-radius: 999px;
    font-size: 0.85rem;
    font-weight: 700;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin: 0;
  }
  .theme-toggle-btn:hover { background: #cbd5e1; }
  html[data-theme="dark"] .theme-toggle-btn {
    background: #334155 !important;
    color: #f8fafc !important;
    border-color: #475569 !important;
  }

  /* ===== Sandbox redesign ===== */
  .sb-tag { display:inline-block; font-size:0.7rem; font-weight:800; background:#fef3c7; color:#92400e; border-radius:6px; padding:2px 7px; vertical-align:middle; margin-left:6px; }
  .head-row { display:flex; justify-content:space-between; align-items:flex-start; gap:10px; }
  .code-badge { display:inline-flex; align-items:center; gap:8px; background:var(--ok-bg); border:1px solid var(--ok-border); color:#065f46; border-radius:999px; padding:4px 12px; font-size:0.85rem; font-weight:700; }
  html[data-theme="dark"] .code-badge { color:#a7f3d0; }
  .link-btn { background:none; border:none; color:var(--accent2); font-weight:600; cursor:pointer; padding:0; font-size:0.82rem; text-decoration:underline; }
  .toolbar { display:flex; gap:8px; align-items:center; position:relative; }
  .toolbar select { flex:0 0 auto; max-width:48%; }
  .toolbar input[type="text"] { flex:1 1 auto; min-width:0; }
  .icon-btn { background:#f1f5f9; border:1px solid var(--border); color:var(--text); border-radius:10px; width:42px; height:40px; font-size:1.15rem; cursor:pointer; flex-shrink:0; display:inline-flex; align-items:center; justify-content:center; }
  html[data-theme="dark"] .icon-btn { background:#334155; border-color:#475569; color:#f1f5f9; }

  .settings-pop label { font-size:0.78rem; font-weight:700; color:var(--muted); text-transform:uppercase; letter-spacing:.4px; }
  .seg { display:flex; gap:4px; background:#e2e8f0; border-radius:10px; padding:3px; }
  html[data-theme="dark"] .seg { background:#0f172a; }
  .seg button { flex:1; border:none; background:transparent; padding:7px 6px; border-radius:8px; font-weight:700; font-size:0.84rem; cursor:pointer; color:var(--text); }
  .seg button.active { background:var(--accent); color:#fff; }
  .card-area { display:flex; align-items:center; gap:8px; margin:14px auto 6px; max-width:640px; }
  .card-area .stage-wrap { flex:1; margin:0; max-width:none; }
  .nav-arrow { width:40px; height:40px; border-radius:50%; border:1px solid var(--border); background:var(--card); color:var(--text); font-size:1.1rem; cursor:pointer; flex-shrink:0; }
  .flashcard { min-height:min(62vh, 460px); touch-action:pan-y; user-select:none; }
  .flashcard .visual-box { width:min(100%, 320px); height:200px; }
  .flashcard .hmong-word { font-size:2.6rem; }
  .flip-hint { font-size:0.82rem; color:var(--muted); }
  .mobile-nav { display:none; justify-content:center; gap:16px; margin-top:8px; }
  .mark-row { display:grid; grid-template-columns:1fr 1fr; gap:10px; max-width:560px; margin:12px auto 0; }
  .mark-row .btn { padding:15px 10px; font-size:1.02rem; border-radius:12px; }
  .add-toggle { width:100%; padding:12px; font-size:1rem; border-radius:12px; }
  .photo-row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-top:10px; }
  .photo-row label.btn { display:inline-block; }
  details.more { margin-top:10px; }
  details.more summary { cursor:pointer; font-weight:700; color:var(--accent); font-size:0.9rem; }
  details.more .more-body { display:flex; flex-direction:column; gap:8px; margin-top:8px; }
  @media (max-width: 600px) {
    body { padding:12px 10px 40px; }
    .card-area > .nav-arrow { display:none; }
    .mobile-nav { display:flex; }
    .flashcard .hmong-word { font-size:2.1rem; }
    .flashcard .visual-box { height:170px; }
    .nav-links a { font-size:0.8rem; padding:5px 9px; }
  }
  .tabs { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 12px; }
  .out-box { text-align:center; padding:14px 8px; border-radius:12px; background:#f8fafc; border:1px solid #e2e8f0; }
  .out-hm { font-size:1.75rem; font-weight:800; color:var(--accent); line-height:1.3; word-break:break-word; }
  .out-en { font-size:1.05rem; color:var(--text); margin-top:6px; font-style:italic; }
  .gloss-row { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:10px; }
  .gw { display:flex; flex-direction:column; align-items:center; border-radius:8px; padding:3px 8px; border-bottom:3px solid var(--c,#94a3b8); background:rgba(148,163,184,.12); }
  .gw b { font-size:.98rem; } .gw small { font-size:.72rem; color:var(--muted); }
  .toggles { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; margin:12px 0 4px; align-items:center; }
  .seg { display:inline-flex; border:1px solid var(--border); border-radius:999px; overflow:hidden; }
  .seg button { border:none; background:transparent; padding:6px 11px; font-size:.82rem; font-weight:700; cursor:pointer; color:var(--text); }
  .seg button.active { background:var(--accent); color:#fff; }
  .seg-label { font-size:.78rem; color:var(--muted); font-weight:700; margin-right:4px; }
  .slots { display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:8px; margin-top:12px; }
  .slot { border-radius:10px; border:1px solid #e2e8f0; border-top:5px solid var(--c); padding:7px 8px; background:var(--card); position:relative; }
  .slot.off { opacity:.55; }
  .slot-h { display:flex; justify-content:space-between; align-items:center; gap:4px; font-size:.74rem; font-weight:800; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
  .slot-h .n { color:var(--c); margin-right:3px; }
  .slot select { width:100%; margin-top:5px; padding:6px; font-size:.9rem; }
  .slot-row { display:flex; gap:4px; align-items:center; }
  .cyc { border:1px solid var(--border); background:transparent; border-radius:6px; cursor:pointer; padding:4px 7px; margin-top:5px; color:var(--text); }
  .info { border:none; background:transparent; cursor:pointer; font-size:.95rem; color:var(--accent2); padding:0 2px; }
  .tip-pop { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); max-width:min(420px,92vw); background:var(--card); color:var(--text); border:2px solid var(--accent2); border-radius:12px; padding:14px 16px; z-index:50; box-shadow:0 12px 40px rgba(0,0,0,.3); white-space:pre-line; font-size:.92rem; }
  .tip-pop h4 { margin:0 0 6px; color:var(--accent); }
  .tip-bg { position:fixed; inset:0; background:rgba(0,0,0,.25); z-index:49; }
  details.ref { margin-top:12px; } details.ref summary { cursor:pointer; font-weight:700; color:var(--accent); }
  .qlist { font-size:.88rem; } .qlist div { padding:4px 0; border-bottom:1px dashed #e2e8f0; } .qlist i { color:var(--muted); }
  .tw-group h3 { margin:12px 0 6px; color:var(--accent); font-size:1.05rem; }
  .tw { padding:8px 10px; border-radius:8px; background:#f8fafc; border:1px solid #e2e8f0; margin-bottom:6px; font-weight:700; }
  .tw .ini { color:#dc2626; }
  .wb { display:flex; flex-wrap:wrap; gap:6px; margin-top:8px; }
  .wb button { border:1px solid var(--border); background:transparent; border-radius:8px; padding:5px 9px; cursor:pointer; color:var(--text); font-size:.86rem; text-align:left; }
  .wb button small { color:var(--muted); display:block; font-size:.7rem; }
  .mine { min-height:2.2em; font-size:1.3rem; font-weight:800; color:var(--accent); padding:8px; border:1px dashed var(--border); border-radius:10px; margin-top:8px; }
  .mw-item { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 0; border-bottom:1px dashed #e2e8f0; font-size:.9rem; }
  .mw-item b { min-width:90px; }

  .muted { color:var(--muted); font-size:.85rem; }
  html[data-theme="dark"] .out-box, html[data-theme="dark"] .tw, html[data-theme="dark"] .slot { background:#1e293b !important; border-color:#334155 !important; color:#e2e8f0; }
  html[data-theme="dark"] .out-hm { color:#93c5fd; } html[data-theme="dark"] .mine { color:#93c5fd; }
  @media (max-width:520px){ .slots{grid-template-columns:repeat(2,1fr);} .out-hm{font-size:1.4rem;} }
</style>

<script>
(function(){
  function applyTheme(t) {
    document.documentElement.setAttribute('data-theme', t);
    var btn = document.getElementById('themeToggleBtn');
    if (btn) {
      btn.innerHTML = t === 'dark' ? '☀️ Light' : '🌙 Dark';
      btn.title = t === 'dark' ? 'Switch to Light Mode' : 'Switch to Dark Mode';
    }
  }
  window.toggleHmongTheme = function() {
    var cur = document.documentElement.getAttribute('data-theme') || 'light';
    var next = cur === 'dark' ? 'light' : 'dark';
    try { localStorage.setItem('hmong_theme', next); } catch(e) {}
    applyTheme(next);
  };
  var saved = 'light';
  try {
    saved = localStorage.getItem('hmong_theme') ||
      (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  } catch(e) {}
  applyTheme(saved);
  document.addEventListener('DOMContentLoaded', function() { applyTheme(saved); });
})();
</script>

</head>

const NOTES_EN = ["'is' is not used in Hmong with agreement of Subject and Adjective. Eng: He is mean → Hmb: Nws siab phem",
 "Sheet example (Hmong): Yog Kuv ib tug phoojywg ntse twb mab mam nrhiav kawg li nrog kuv ib tug aub dawb dawb tom tsev nag hmo lawm.",
 "Sheet examples (Simple): Nag hmo Kuv twb khiav ceev ceev lawm. · Tag kis Nws mam li ntxuav tus dev. · Hnub no tus Dev yuav tsum taug kev (mus) pem lub tsev. · Kuv tus miv dub mab mam nrhia nrhau lub npas dawb.",
 "Sheet example: Lub qho rooj tsheb = the door of the car (classifier before 1st noun only)."];

let uiLang = "en", tab = "simple", tense = "present", timePos = "start";
const state = { simple:{}, full:{} };   // slotId -> index into options, or -1 (skip)
let customWords = [];
const L = k => (I18N[uiLang] && I18N[uiLang][k]) || I18N.en[k] || k;
const gl = w => (w[uiLang] && uiLang !== "en" ? w[uiLang] : w.en) || "";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const POS_ALIAS = { modal:"verb", place:"place" };
function optionsFor(t) {
  const base = (BANK[t] || []).slice();
  customWords.forEach(cw => {
    const p = POS_ALIAS[cw.pos] || cw.pos;
    if (p === t && !base.some(b => b.hm.toLowerCase() === cw.hmong.toLowerCase()))
      base.push({ hm: cw.hmong, en: cw.en, vi: cw.vi, ko: cw.ko, ja: cw.ja, custom: 1, s: cw.en, past: cw.en });
  });
  return base;
}
function slotsOf() { return MODES[tab]; }
function sel(id) { const s = slotsOf().find(x => x.id === id); if (!s || s.t === "tense") return null; const i = state[tab][id]; if (i == null || i < 0) return null; return optionsFor(s.t)[i] || null; }

function ensureDefaults() {
  const st = state[tab];
  slotsOf().forEach(s => { if (st[s.id] == null) st[s.id] = s.opt ? -1 : 0; });
}

function assemble() {
  const parts = []; // {hm, en, t}
  const push = (hm, en, t) => parts.push({ hm: /^Hmoob/.test(hm) ? hm : hm.charAt(0).toLowerCase() + hm.slice(1), en, t });
  const time = sel("time");
  if (time && timePos === "start") push(time.hm, time.en, "time");
  let lastAdj = null;
  slotsOf().forEach(s => {
    if (s.t === "time") return;
    if (s.t === "tense") {
      if (tense === "past") push("twb", "already", "tense");
      else if (tense === "yuav") push("yuav", "going to / will", "tense");
      else if (tense === "mamli") push("mam li", "will", "tense");
      return;
    }
    const w = sel(s.id); if (!w) return;
    if (s.t === "advadj") { if (lastAdj) push(lastAdj.hm, "very", "advadj"); return; }
    if (s.t === "adj") lastAdj = w;
    push(w.hm, gl(w), s.t);
  });
  if (time && timePos === "end") push(time.hm, time.en, "time");
  if (tense === "past") push("lawm", "(past)", "tense");
  let hm = parts.map(p => p.hm).join(" ");
  if (hm) hm = hm.charAt(0).toUpperCase() + hm.slice(1) + ".";
  return { parts, hm };
}

// Rough English rendering from the English glosses (word order rearranged to English).
function englishOf() {
  const g = id => sel(id);
  const out = [];
  const time = g("time"), subj = g("subj"), verb = g("verb");
  if (!subj || !verb) return "";
  if (g("interj")) out.push(g("interj").en + ",");
  if (time && timePos === "start") out.push(time.en + ",");
  const noun2 = tab === "full" ? g("noun2") : null;
  const adj1 = g("adj1");
  let s;
  if (noun2) { const n = g("num1"); s = (n && n.hm === "ib" ? "one of " : n ? n.en + " of " : "") + (subj.poss || subj.en) + " " + (adj1 ? adj1.en + " " : "") + noun2.en + (n ? "s" : ""); }
  else s = (g("clf1") && subj.noun ? "the " : "") + (adj1 ? adj1.en + " " : "") + subj.en;
  out.push(s);
  const third = noun2 ? !(g("num1") && g("num1").hm !== "ib") : !!subj.p3;
  const adv = g("adv"), pa = g("postadv"), inf = g("inf");
  let aux = "", v;
  if (tense === "past") { aux = "already"; v = verb.past || verb.en; }
  else if (tense === "yuav") { aux = (subj.hm === "Kuv" && !noun2 ? "am" : third ? "is" : "are") + " going to"; v = verb.en; }
  else if (tense === "mamli") { aux = "will"; v = verb.en; }
  else v = third ? (verb.s || verb.en) : verb.en;
  out.push([aux, adv ? adv.en : "", v].filter(Boolean).join(" "));
  if (inf) out.push(inf.en);
  if (pa) out.push(pa.en);
  if (g("advadv")) out.push(g("advadv").en);
  if (g("prep")) out.push(g("prep").en);
  const obj = g("obj");
  if (obj) {
    const poss = g("poss"), n2 = g("num2"), clfO = g(tab === "full" ? "clf3" : "clf2"), a2 = g("adj2"), very = g("advadj");
    let o = poss ? poss.en + " " : (n2 ? "" : (clfO ? "the " : ""));
    if (n2) o = (n2.hm === "ib" ? "one of " : n2.en + " of ") + (poss ? poss.en + " " : "the ");
    o += (a2 ? (very ? "very " : "") + a2.en + " " : "") + obj.en + (n2 ? "s" : "");
    out.push(o);
  }
  if (g("dir")) out.push(g("dir").en);
  if (g("place")) out.push(g("place").en);
  if (time && timePos === "end") out.push(time.en);
  let e = out.join(" ").replace(/\s+/g, " ").replace(/,$/, "").trim();
  return e.charAt(0).toUpperCase() + e.slice(1) + ".";
}

function renderOutput() {
  const { parts, hm } = assemble();
  document.getElementById("outHm").textContent = hm || "…";
  document.getElementById("outGloss").innerHTML = parts.map(p =>
    `<span class="gw" style="--c:${COLORS[p.t] || "#94a3b8"}"><b>${esc(p.hm)}</b><small>${esc(p.en)}</small></span>`).join("");
  const en = englishOf();
  document.getElementById("outEn").textContent = en ? L("enLabel") + ": " + en : "";
}

function renderSlots() {
  ensureDefaults();
  const box = document.getElementById("slots");
  box.innerHTML = slotsOf().map((s, idx) => {
    const c = COLORS[s.t]; const lab = (SLOT_LABELS[s.t][uiLang] || SLOT_LABELS[s.t].en);
    const head = `<div class="slot-h"><span><span class="n">${idx + 1}</span>${esc(lab)}</span><button class="info" title="tip" onclick="showTip('${s.t}')">ⓘ</button></div>`;
    if (s.t === "tense") {
      const v = { present: "∅", past: "twb … lawm", yuav: "yuav", mamli: "mam li" }[tense];
      return `<div class="slot" style="--c:${c}">${head}<div style="font-weight:800;margin-top:8px">${v}</div></div>`;
    }
    const opts = optionsFor(s.t); const cur = state[tab][s.id];
    const o = (s.opt ? `<option value="-1">${L("skip")}</option>` : "") +
      opts.map((w, i) => `<option value="${i}" ${i === cur ? "selected" : ""}>${esc(w.dup ? "×2" : w.hm)}${gl(w) ? " — " + esc(gl(w)) : ""}${w.custom ? " ★" : ""}</option>`).join("");
    return `<div class="slot ${cur < 0 ? "off" : ""}" style="--c:${c}">${head}<div class="slot-row"><select data-slot="${s.id}" onchange="setSlot('${s.id}',+this.value)">${o}</select><button class="cyc" onclick="cycle('${s.id}')">↻</button></div></div>`;
  }).join("");
  renderOutput();
}
function setSlot(id, v) {
  state[tab][id] = v;
  if (id === "time") { // keep tense consistent with the chosen time word
    const t = optionsFor("time")[v];
    if (t && t.hm === "Nag hmo" && tense !== "past") tense = "past";
    if (t && t.hm === "Tag kis" && (tense === "past" || tense === "present")) tense = "yuav";
    renderToggles();
  }
  renderSlots();
}
function cycle(id) {
  const s = slotsOf().find(x => x.id === id); const n = optionsFor(s.t).length;
  let v = state[tab][id] + 1; if (v >= n) v = s.opt ? -1 : 0; state[tab][id] = v; renderSlots();
}
function clearAll() { state[tab] = {}; tense = "present"; renderToggles(); renderSlots(); }

const rnd = n => Math.floor(Math.random() * n);
const idxOf = (t, hm) => optionsFor(t).findIndex(w => w.hm === hm);
function randomize() {
  const st = state[tab] = {};
  const pick = t => rnd(optionsFor(t).length);
  const maybe = (p = 0.5) => Math.random() < p;
  slotsOf().forEach(s => { st[s.id] = -1; });
  st.time = maybe(0.6) ? pick("time") : -1;
  st.subj = pick("subj");
  const subj = optionsFor("subj")[st.subj];
  if (subj.clf) st.clf1 = idxOf("clf", subj.clf);
  if (tab === "full") {
    if (maybe(0.3)) st.interj = pick("interj");
    if (subj.poss && maybe(0.6)) {  // possessor + "one of my friend" pattern
      st.noun2 = 0; /* phoojywg (friend), as in the sheet example */ const n2 = optionsFor("noun2")[st.noun2];
      if (maybe()) { st.num1 = idxOf("num", "ib"); st.clf2 = idxOf("clf", n2.clf === "tus" ? "tug" : n2.clf); }
      if (maybe()) st.adj1 = idxOf("adj", ["ntse","zoo"][rnd(2)]);
    }
  } else if (!subj.poss && maybe(0.4)) st.adj1 = pick("adj");
  st.verb = pick("verb"); const verb = optionsFor("verb")[st.verb];
  if (maybe(0.35)) st.adv = pick("adv");
  if (verb.modal) st.inf = pick("inf");
  else if (!verb.tr && maybe(0.5)) st.postadv = pick("postadv");
  const direct = !!(verb.tr && verb.objs);
  if (direct || maybe(0.4)) {
    const PLACES = ["tsev", "npas", "tsheb"]; // prep + object, as in 'nrhau lub npas', 'pem lub tsev'
    if (!direct) st.prep = pick("prep");
    const list = direct ? verb.objs : PLACES;
    st.obj = idxOf("obj", list[rnd(list.length)]); const obj = optionsFor("obj")[st.obj];
    const clfSlot = tab === "full" ? "clf3" : "clf2";
    if (tab === "full" && obj.clf && maybe(0.4)) { st.poss = 0; if (maybe()) { st.num2 = idxOf("num", "ib"); } }
    if (obj.clf) st[clfSlot] = idxOf("clf", (st.num2 >= 0 && obj.clf === "tus") ? "tug" : obj.clf);
    if (obj.clf && maybe(0.5)) { st.adj2 = idxOf("adj", ["dub","dawb","zoo"][rnd(3)]); if (tab === "full" && maybe(0.4)) st.advadj = 0; }
  }
  if (tab === "full" && maybe(0.3)) { st.dir = idxOf("dir", "tom"); st.place = 0; }
  const tz = ["present", "past", "yuav", "mamli"];
  tense = tz[rnd(4)];
  const t = optionsFor("time")[st.time];
  if (t) { if (t.hm === "Nag hmo") tense = "past"; else if (t.hm === "Tag kis") tense = maybe() ? "yuav" : "mamli"; }
  renderToggles(); renderSlots();
}

function renderToggles() {
  document.querySelectorAll("#segTense button").forEach(b => b.classList.toggle("active", b.dataset.v === tense));
  document.querySelectorAll("#segTime button").forEach(b => b.classList.toggle("active", b.dataset.v === timePos));
}
document.addEventListener("click", e => {
  const b = e.target.closest("#segTense button, #segTime button"); if (!b) return;
  if (b.parentElement.id === "segTense") tense = b.dataset.v; else timePos = b.dataset.v;
  renderToggles(); renderSlots();
});

function showTip(t) {
  const tip = TIPS[t] || {}; const lab = SLOT_LABELS[t][uiLang] || SLOT_LABELS[t].en;
  document.getElementById("tipLayer").innerHTML = `<div class="tip-bg" onclick="hideTip()"></div><div class="tip-pop" role="dialog"><h4>ⓘ ${esc(lab)}</h4>${esc(tip[uiLang] || tip.en || "")}${uiLang !== "en" && tip.en ? `<hr><small class="muted">${esc(tip.en)}</small>` : ""}<div style="text-align:right;margin-top:8px"><button class="btn" onclick="hideTip()">OK</button></div></div>`;
}
function hideTip() { document.getElementById("tipLayer").innerHTML = ""; }
function copyText(s) { try { navigator.clipboard.writeText(s); } catch (e) {} }
function copySentence() { copyText(assemble().hm); }

// ===== Begins with =====
const initialOf = w => { const m = w.match(/^(nts|nch|ntx|nph|nth|nrh|nqh|nkh|ntsh|tsh|txh|plh|nyh|dh|hl|hm|hn|hny|ch|kh|ny|ph|qh|rh|th|ts|tx|xy|nk|np|nq|nr|nt|pl|n|[a-z])/i); return m ? m[0].toLowerCase() : ""; };
let mineWords = []; let curLetter = "";
function allBankWords() {
  const seen = new Map();
  Object.keys(BANK).forEach(t => optionsFor(t).forEach(w => { if (!w.dup && !seen.has(w.hm.toLowerCase())) seen.set(w.hm.toLowerCase(), w); }));
  customWords.forEach(cw => { if (!seen.has(cw.hmong.toLowerCase())) seen.set(cw.hmong.toLowerCase(), { hm: cw.hmong, en: cw.en, vi: cw.vi, ko: cw.ko, ja: cw.ja, custom: 1 }); });
  return [...seen.values()];
}
function renderBegins() {
  const groups = {};
  TWISTERS.forEach(s => { const k = s[0].toUpperCase(); (groups[k] = groups[k] || []).push(s); });
  document.getElementById("twisters").innerHTML = Object.keys(groups).map(k => `<div class="tw-group"><h3>${k}…</h3>${groups[k].map(s =>
    `<div class="tw">${s.split(/(\s+)/).map(w => /^\s+$/.test(w) ? w : (w[0].toUpperCase() === k ? `<span class="ini">${esc(w[0])}</span>${esc(w.slice(1))}` : esc(w))).join("")}</div>`).join("")}</div>`).join("");
  const words = allBankWords();
  const letters = [...new Set(words.map(w => w.hm[0].toUpperCase()))].sort();
  if (!curLetter) curLetter = "T";
  document.getElementById("letterPills").innerHTML = letters.map(l => `<button class="pill ${l === curLetter ? "active" : ""}" onclick="curLetter='${l}';renderBegins()">${l}</button>`).join("");
  document.getElementById("letterWords").innerHTML = words.filter(w => w.hm[0].toUpperCase() === curLetter)
    .map(w => `<button onclick='mineAdd(${JSON.stringify(w.hm)})'>${esc(w.hm)}${w.custom ? " ★" : ""}<small>${esc(gl(w))}</small></button>`).join("") || `<span class="muted">—</span>`;
  document.getElementById("mineLine").textContent = mineWords.length ? (mineWords.join(" ").replace(/^./, c => c.toUpperCase())) : "…";
}
function mineAdd(w) { mineWords.push(w); renderBegins(); }
function mineUndo() { mineWords.pop(); renderBegins(); }
function mineClear() { mineWords = []; renderBegins(); }
function mineCopy() { copyText(document.getElementById("mineLine").textContent); }

// ===== Student code + My Words (same storage keys and /api/student-words as the live tool) =====
const ASSIGNABLE = ["subj","noun2","obj","place","verb","inf","adj","adv","postadv","prep","time","interj","clf","num","dir"];
function normalizeStudentCode(raw) { return String(raw || "").trim().toUpperCase().replace(/^HMONG-/, "HMOOB-"); }
let activeStudentCode = normalizeStudentCode(localStorage.getItem("hmong_student_code") || "");
let activeStudentName = localStorage.getItem("hmong_student_name") || "";
let syncState = "local";
const storageKey = c => c ? `hmong_custom_words_${c}` : "ulgt_custom_words";
function normWord(item) {
  if (!item || typeof item !== "object") return null;
  const hmong = String(item.hmong || item.w || "").trim();
  const en = String(item.en || item.vi || item.ko || item.ja || "").trim();
  if (!hmong || !en) return null;
  // keep every other field (img, emoji, photo…) so we never drop data saved by other tools
  return Object.assign({}, item, { hmong, en, vi: String(item.vi || en), ko: String(item.ko || en), ja: String(item.ja || en), pos: String(item.pos || item.role || "obj") });
}
function mergeWords(a, b) { const m = new Map(); [...(a || []), ...(b || [])].forEach(r => { const n = normWord(r); if (n) m.set(n.hmong.toLowerCase(), n); }); return [...m.values()]; }
function saveLocal() {
  try { localStorage.setItem("ulgt_custom_words", JSON.stringify(customWords)); if (activeStudentCode) localStorage.setItem(storageKey(activeStudentCode), JSON.stringify(customWords)); } catch (e) {}
  renderWords(); if (tab === "begins") renderBegins(); else if (tab !== "words") renderSlots();
}
function loadLocal() {
  let arr = [];
  try { arr = JSON.parse(localStorage.getItem(storageKey(activeStudentCode)) || localStorage.getItem("ulgt_custom_words") || "[]"); } catch (e) {}
  customWords = mergeWords([], arr);
}
async function pushCloud() {
  if (!activeStudentCode) { syncState = "local"; renderWords(); return; }
  syncState = "syncing"; renderWords();
  try {
    const r = await fetch("/api/student-words", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ code: activeStudentCode, studentName: activeStudentName, words: customWords }) });
    const d = r.ok ? await r.json() : null; syncState = d && d.ok ? "cloud_ok" : "local";
  } catch (e) { syncState = "local"; }
  renderWords();
}
async function connectStudentCode(raw, silent) {
  const code = normalizeStudentCode(raw);
  const st = document.getElementById("syncStatus");
  if (!/^[A-Z0-9-]{3,24}$/.test(code)) { if (!silent) st.textContent = L("badCode"); return; }
  activeStudentCode = code; localStorage.setItem("hmong_student_code", code);
  document.getElementById("studentCodeInput").value = code;
  let local = []; try { local = JSON.parse(localStorage.getItem(storageKey(code)) || "[]"); } catch (e) {}
  customWords = mergeWords(customWords, local);
  syncState = "syncing"; saveLocal();
  try {
    const r = await fetch(`/api/student-words?code=${encodeURIComponent(code)}`, { headers: { Accept: "application/json" } });
    const d = r.ok ? await r.json() : null;
    if (d && d.ok) {
      if (d.studentName) { activeStudentName = d.studentName; localStorage.setItem("hmong_student_name", activeStudentName); }
      const cloud = Array.isArray(d.words) ? d.words : [];
      customWords = mergeWords(customWords, cloud);
      syncState = d.mode === "roster_fallback" ? "local" : "cloud_ok";
      saveLocal();
      if (syncState === "cloud_ok" && customWords.length > cloud.length) await pushCloud();
    } else { syncState = "local"; saveLocal(); }
  } catch (e) { syncState = "local"; saveLocal(); }
}
function posOptions(cur) {
  const known = ASSIGNABLE.includes(POS_ALIAS[cur] || cur);
  return (known ? "" : `<option value="${esc(cur)}" selected>${esc(cur)} ${L("notInBuilder")}</option>`) +
    ASSIGNABLE.map(p => `<option value="${p}" ${(POS_ALIAS[cur] || cur) === p ? "selected" : ""}>${esc(SLOT_LABELS[p][uiLang] || SLOT_LABELS[p].en)}</option>`).join("");
}
function renderWords() {
  const st = document.getElementById("syncStatus");
  st.textContent = activeStudentCode ? `${activeStudentCode}${activeStudentName && activeStudentName !== activeStudentCode ? " (" + activeStudentName + ")" : ""} · ` +
    (syncState === "cloud_ok" ? "☁️ " + L("connected") : syncState === "syncing" ? L("syncing") : L("localOnly")) : L("localOnly");
  document.getElementById("nwPos").innerHTML = posOptions("obj");
  const list = document.getElementById("myWordsList");
  list.innerHTML = customWords.length ? customWords.map((w, i) => `<div class="mw-item"><b>${esc(w.hmong)}</b><span>${esc(w[uiLang] || w.en)}</span>
     <select onchange="assignPos(${i},this.value)">${posOptions(w.pos)}</select>
     <button class="btn btn-outline" style="padding:3px 8px" onclick="removeWord(${i})">${L("remove")}</button></div>`).join("") : `<p class="muted">${L("none")}</p>`;
}
function assignPos(i, p) { customWords[i].pos = p; saveLocal(); pushCloud(); }
function removeWord(i) { customWords.splice(i, 1); saveLocal(); pushCloud(); }
function addMyWord() {
  const v = id => document.getElementById(id).value.trim();
  const hm = v("nwHm"), en = v("nwEn") || v("nwVi") || v("nwKo") || v("nwJa");
  const s = document.getElementById("addStatus");
  if (!hm || !en) { s.textContent = L("needHm"); return; }
  customWords = mergeWords(customWords, [{ hmong: hm, en, vi: v("nwVi"), ko: v("nwKo"), ja: v("nwJa"), pos: document.getElementById("nwPos").value }]);
  ["nwHm","nwEn","nwVi","nwKo","nwJa"].forEach(id => document.getElementById(id).value = "");
  s.textContent = L("added"); saveLocal(); pushCloud();
}

// ===== Tabs / language =====
function setTab(t) {
  tab = t;
  ["simple","full","begins","words"].forEach(x => document.getElementById("tab-" + x).classList.toggle("active", x === t));
  document.getElementById("view-builder").classList.toggle("hidden", !(t === "simple" || t === "full"));
  document.getElementById("view-begins").classList.toggle("hidden", t !== "begins");
  document.getElementById("view-words").classList.toggle("hidden", t !== "words");
  if (t === "simple" || t === "full") { const tw = sel("time");
    if (tw && tw.hm === "Nag hmo") tense = "past"; else if (tw && tw.hm === "Tag kis" && (tense === "past" || tense === "present")) tense = "yuav";
    renderToggles(); renderSlots(); } else if (t === "begins") renderBegins(); else renderWords();
}
function renderNotes() {
  document.getElementById("notesBody").innerHTML = NOTES_EN.map(n => `<div>${esc(n)}</div>`).join("");
  document.getElementById("qBody").innerHTML = QUESTIONS.map(q => q[1] ? `<div><i>${esc(q[0])}</i><br><b>${esc(q[1])}</b></div>` : `<div><b style="color:var(--accent)">${esc(q[0])}</b></div>`).join("");
}
function setUILang(l) {
  uiLang = I18N[l] ? l : "en";
  try { localStorage.setItem("hmong_ui_lang", uiLang); } catch (e) {}
  document.documentElement.lang = uiLang;
  ["en","vi","ko","ja"].forEach(x => document.getElementById("btn-" + x).classList.toggle("active", x === uiLang));
  document.querySelectorAll("[data-i]").forEach(el => { el.textContent = L(el.dataset.i); });
  renderNotes(); setTab(tab);
}
window.addEventListener("DOMContentLoaded", () => {
  loadLocal();
  if (activeStudentCode) document.getElementById("studentCodeInput").value = activeStudentCode;
  renderToggles();
  let saved = "en"; try { saved = localStorage.getItem("hmong_ui_lang") || "en"; } catch (e) {}
  setUILang(saved);
  if (activeStudentCode) connectStudentCode(activeStudentCode, true);
});
</script>
